  <script type="text/babel">
    const { useState, useEffect } = React;
    const { createStore, combineReducers, applyMiddleware, compose } = Redux;

    // Robust Redux-Thunk middleware definition (ensures valid function always)
    const thunk = (typeof window !== 'undefined' && window.ReduxThunk && typeof window.ReduxThunk === 'function')
      ? window.ReduxThunk
      : (typeof window !== 'undefined' && window.ReduxThunk && window.ReduxThunk.default)
      ? window.ReduxThunk.default
      : ((store) => (next) => (action) => {
          if (typeof action === 'function') {
            return action(store.dispatch, store.getState);
          }
          return next(action);
        });



    // =========================================================================

    // =========================================================================
    // 2. REDUX ACTION TYPES
    // =========================================================================
    const ADD_TO_CART = 'ADD_TO_CART';
    const REMOVE_FROM_CART = 'REMOVE_FROM_CART';
    const UPDATE_QUANTITY = 'UPDATE_QUANTITY';
    const CLEAR_CART = 'CLEAR_CART';

    const ADD_TO_WISHLIST = 'ADD_TO_WISHLIST';
    const REMOVE_FROM_WISHLIST = 'REMOVE_FROM_WISHLIST';

    const FETCH_OFFERS_START = 'FETCH_OFFERS_START';
    const FETCH_OFFERS_SUCCESS = 'FETCH_OFFERS_SUCCESS';
    const FETCH_OFFERS_FAILURE = 'FETCH_OFFERS_FAILURE';

    // =========================================================================
    // 3. ACTION CREATORS (Q2 & Q4)
    // =========================================================================
    const addToCart = (product) => ({
      type: ADD_TO_CART,
      payload: product
    });

    const removeFromCart = (productId) => ({
      type: REMOVE_FROM_CART,
      payload: { id: productId }
    });

    const updateQuantity = (productId, quantity) => ({
      type: UPDATE_QUANTITY,
      payload: { id: productId, quantity }
    });

    const clearCart = () => ({
      type: CLEAR_CART
    });

    const addToWishlist = (product) => ({
      type: ADD_TO_WISHLIST,
      payload: product
    });

    const removeFromWishlist = (productId) => ({
      type: REMOVE_FROM_WISHLIST,
      payload: { id: productId }
    });

    // Async Action Creator using Redux Thunk (Q4)
    const fetchOffers = () => {
      return (dispatch) => {
        dispatch({ type: FETCH_OFFERS_START });

        // Simulating API network call with setTimeout (Hint in Q4)
        setTimeout(() => {
          const discountOffers = [
            {
              id: 'OFF-1',
              title: '⚡ Flash Diwali Sale: 25% OFF on Audio Gear',
              code: 'AUDIO25',
              discount: '25%',
              badge: 'Limited Time',
              expiry: 'Expires in 4 hours'
            },
            {
              id: 'OFF-2',
              title: '🎁 Bundle Bonus: Free Logitech Mouse Pad with MX 3S',
              code: 'LOGIBONUS',
              discount: 'Free Gift',
              badge: 'Exclusive',
              expiry: 'Valid today'
            },
            {
              id: 'OFF-3',
              title: '💳 HDFC & Axis Bank Instant Cashback Rs. 3,000',
              code: 'BANKCASH',
              discount: '₹3,000 Off',
              badge: 'Instant Bank',
              expiry: 'Till stocks last'
            }
          ];

          dispatch({
            type: FETCH_OFFERS_SUCCESS,
            payload: discountOffers
          });
        }, 1200);
      };
    };

    // =========================================================================
    // 4. REDUCERS (Q1 & Q3)
    // =========================================================================

    // Q1: cartReducer managing array of items
    function cartReducer(state = [], action) {
      switch (action.type) {
        case ADD_TO_CART: {
          const existingItemIndex = state.findIndex(item => item.id === action.payload.id);
          if (existingItemIndex >= 0) {
            // Item exists, increment quantity immutably
            return state.map((item, index) =>
              index === existingItemIndex
                ? { ...item, quantity: item.quantity + 1 }
                : item
            );
          } else {
            // New item, add with quantity 1
            return [...state, { ...action.payload, quantity: 1 }];
          }
        }

        case REMOVE_FROM_CART: {
          return state.filter(item => item.id !== action.payload.id);
        }

        case UPDATE_QUANTITY: {
          if (action.payload.quantity <= 0) {
            return state.filter(item => item.id !== action.payload.id);
          }
          return state.map(item =>
            item.id === action.payload.id
              ? { ...item, quantity: action.payload.quantity }
              : item
          );
        }

        case CLEAR_CART:
          return [];

        default:
          return state;
      }
    }

    // Q3: wishlistReducer managing separate wishlist state
    function wishlistReducer(state = [], action) {
      switch (action.type) {
        case ADD_TO_WISHLIST: {
          const exists = state.some(item => item.id === action.payload.id);
          if (exists) return state;
          return [...state, action.payload];
        }

        case REMOVE_FROM_WISHLIST: {
          return state.filter(item => item.id !== action.payload.id);
        }

        default:
          return state;
      }
    }

    // Q4: offersReducer managing async discount offers
    const initialOffersState = {
      items: [],
      loading: false,
      error: null,
      lastFetched: null
    };

    function offersReducer(state = initialOffersState, action) {
      switch (action.type) {
        case FETCH_OFFERS_START:
          return { ...state, loading: true, error: null };
        case FETCH_OFFERS_SUCCESS:
          return { ...state, loading: false, items: action.payload, lastFetched: new Date().toLocaleTimeString() };
        case FETCH_OFFERS_FAILURE:
          return { ...state, loading: false, error: action.payload };
        default:
          return state;
      }
    }

    // =========================================================================
    // 5. ROOT REDUCER & STORE CONFIGURATION WITH DEVTOOLS (Q3 & Q5)
    // =========================================================================
    const rootReducer = combineReducers({
      cart: cartReducer,
      wishlist: wishlistReducer,
      offers: offersReducer
    });

    // Logging middleware to track actions in DevTools visual stream
    const actionHistory = [];
    const trackingMiddleware = store => next => action => {
      const prevState = store.getState();
      const result = next(action);
      const nextState = store.getState();
      actionHistory.unshift({
        type: action.type,
        payload: action.payload,
        time: new Date().toLocaleTimeString(),
        prevState,
        nextState
      });
      return result;
    };

    // Q5: Setup Redux DevTools Extension Compose
    const composeEnhancers = (typeof window !== 'undefined' && window.__REDUX_DEVTOOLS_EXTENSION_COMPOSE__) || compose;
    const store = createStore(
      rootReducer,
      composeEnhancers(applyMiddleware(thunk, trackingMiddleware))
    );

    // =========================================================================
    // 6. MAIN REACT APP COMPONENT
    // =========================================================================
    function App() {
      const [reduxState, setReduxState] = useState(store.getState());
      const [activeTab, setActiveTab] = useState('shop'); // 'shop' | 'cart' | 'wishlist' | 'devtools' | 'docs'
      const [appliedPromo, setAppliedPromo] = useState(null);
      const [toast, setToast] = useState(null);

      // Subscribe to store updates
      useEffect(() => {
        const unsubscribe = store.subscribe(() => {
          setReduxState(store.getState());
        });
        return () => unsubscribe();
      }, []);

      const showToast = (message, type = 'info') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };

      const handleAddToCart = (product) => {
        store.dispatch(addToCart(product));
        showToast(`🛒 "${product.name.substring(0, 22)}..." added to cart!`, 'cart');
      };

      const handleRemoveFromCart = (productId) => {
        store.dispatch(removeFromCart(productId));
        showToast(`🗑️ Removed from cart!`, 'remove');
      };

      const handleToggleWishlist = (product) => {
        const isFav = reduxState.wishlist.some(item => item.id === product.id);
        if (isFav) {
          store.dispatch(removeFromWishlist(product.id));
          showToast(`💔 Removed from wishlist!`, 'wishlist');
        } else {
          store.dispatch(addToWishlist(product));
          showToast(`❤️ Added to wishlist!`, 'wishlist');
        }
      };

      const handleFetchOffers = () => {
        store.dispatch(fetchOffers());
      };

      // Calculations
      const cartItemCount = reduxState.cart.reduce((sum, item) => sum + item.quantity, 0);
      const subtotal = reduxState.cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      const discount = appliedPromo ? (subtotal * 0.15) : 0;
      const total = subtotal - discount;

      return (
        <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>

          {/* Toast Notification */}
          {toast && (
            <div className="animate-fadeIn" style={{
              position: 'fixed',
              top: '20px',

              backgroundColor: toast.type === 'remove' ? '#ef4444' : toast.type === 'wishlist' ? '#ec4899' : '#10b981',

                  🛒
                </div>
                <div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                    <h1 style={{ fontSize: '18px', fontWeight: '800', color: '#fff', margin: 0 }}>
                      Redux Reducer Hub
                    </h1>

                    </span>
                  </div>

              </div>

              {/* Navigation Tabs */}

              <div>

                  <div style={{ display: 'flex', gap: '8px' }}>

                      🛒 Cart Items: <strong style={{ color: '#10b981' }}>{cartItemCount}</strong>

                      </h4>
                    </div>
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))', gap: '12px' }}>
                      {reduxState.offers.items.map(offer => (
                        <div key={offer.id} style={{ backgroundColor: '#1e1b4b', border: '1px dashed #6366f1', borderRadius: '8px', padding: '12px' }}>

                <span>✅ Q5: Redux DevTools</span>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    // =========================================================================
    // 7. PRODUCT CARD COMPONENT (Q2 Requirement)
    // =========================================================================
    function ProductCard({ product, cartItem, isWishlisted, onAddToCart, onRemoveFromCart, onToggleWishlist }) {
      return (
        <div className="glass-card glass-card-hover" style={{ padding: '20px', display: 'flex', flexDirection: 'column', gap: '14px', position: 'relative' }}>
          
          {/* Top Badge & Wishlist Heart */}
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <span style={{ fontSize: '11px', backgroundColor: '#1e1b4b', color: '#a5b4fc', border: '1px solid #3730a3', padding: '2px 8px', borderRadius: '4px', fontWeight: '700' }}>
              {product.tag}
            </span>
            <button
              onClick={onToggleWishlist}
              title={isWishlisted ? "Remove from wishlist" : "Add to wishlist"}
              style={{
                width: '34px',
                height: '34px',
                borderRadius: '50%',
                backgroundColor: isWishlisted ? 'rgba(236, 72, 153, 0.2)' : '#1e293b',
                color: isWishlisted ? '#ec4899' : '#94a3b8',
                border: isWishlisted ? '1px solid #ec4899' : '1px solid #334155',
                fontSize: '16px'
              }}
            >
              {isWishlisted ? '❤️' : '🤍'}
            </button>
          </div>

          {/* Product Icon & Visual */}
          <div style={{ height: '110px', backgroundColor: '#0f172a', borderRadius: '10px', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '54px' }}>
            {product.image}
          </div>

          {/* Product Info */}
          <div>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '4px' }}>
              <span style={{ fontSize: '11px', color: '#64748b', textTransform: 'uppercase', fontWeight: '700', letterSpacing: '0.05em' }}>
                {product.category}
              </span>
              <span style={{ fontSize: '12px', color: '#f59e0b', fontWeight: '700' }}>
                ★ {product.rating}
              </span>
            </div>
            <h3 style={{ fontSize: '15px', fontWeight: '700', color: '#ffffff', lineHeight: 1.4, margin: '4px 0 8px 0', minHeight: '42px' }}>
              {product.name}
            </h3>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <span style={{ fontSize: '18px', fontWeight: '800', color: '#38bdf8' }}>
                ₹{product.price.toLocaleString('en-IN')}
              </span>
              {cartItem && (
                <span style={{ fontSize: '11px', backgroundColor: '#065f46', color: '#6ee7b7', padding: '2px 8px', borderRadius: '4px', fontWeight: '700' }}>
                  In Cart: {cartItem.quantity}
                </span>
              )}
            </div>
          </div>

          {/* Q2: Two Buttons (Add to Cart & Remove from Cart) */}
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px', marginTop: 'auto', paddingTop: '6px' }}>
            
            {/* Button 1: Add to Cart */}
            <button
              onClick={onAddToCart}
              style={{
                backgroundColor: '#4f46e5',
                color: '#ffffff',
                padding: '9px 12px',
                borderRadius: '6px',
                fontSize: '12px',
                fontWeight: '700',
                boxShadow: '0 2px 6px rgba(79, 70, 229, 0.4)'
              }}
            >
              + Add to Cart
            </button>

            {/* Button 2: Remove from Cart */}
            <button
              onClick={onRemoveFromCart}
              disabled={!cartItem}
              style={{
                backgroundColor: cartItem ? '#ef4444' : '#1e293b',
                color: cartItem ? '#ffffff' : '#64748b',
                padding: '9px 12px',
                borderRadius: '6px',
                fontSize: '12px',
                fontWeight: '700',
                cursor: cartItem ? 'pointer' : 'not-allowed',
                border: '1px solid',
                borderColor: cartItem ? '#dc2626' : '#334155'
              }}
            >
              - Remove
            </button>

          </div>

        </div>
      );
    }

    // Render into root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
