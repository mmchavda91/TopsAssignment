<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>

    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="cardGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="cardGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="720" fill="url(#bgGrad)" rx="16" />

  <!-- Title Header -->
  <text x="480" y="55" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle">
    SoundPulse Music App — User Interaction Flow Diagram
  </text>
  <text x="480" y="85" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" text-anchor="middle">
    End-to-End User Journey from Landing Page to Main Feature &amp; Logout
  </text>

  <!-- ================= ROW 1: Steps 1, 2, 3 ================= -->

  <!-- STEP 1: Landing Page -->
  <g transform="translate(60, 130)" filter="url(#dropShadow)">
    <rect width="240" height="180" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <rect width="240" height="38" rx="12" fill="url(#cardGrad1)" />
    <!-- Round top corners only -->
    <rect y="26" width="240" height="12" fill="url(#cardGrad1)" />
    <text x="120" y="24" fill="#ffffff" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">STEP 1: Landing Page</text>
    
    <text x="120" y="70" fill="#38bdf8" font-family="Segoe UI, Inter, sans-serif" font-size="28" text-anchor="middle">🌐</text>
    <text x="120" y="105" fill="#f1f5f9" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Welcome &amp; Hero Section</text>
    <text x="120" y="128" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="11" text-anchor="middle">• Value Proposition</text>
    <text x="120" y="146" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="11" text-anchor="middle">• Preview Demo Tracklists</text>
    <text x="120" y="164" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="11" text-anchor="middle">• "Get Started" CTA Button</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="300" y1="220" x2="350" y2="220" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)" />

  <!-- STEP 2: Authentication -->
  <g transform="translate(360, 130)" filter="url(#dropShadow)">
    <rect width="240" height="180" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" />
    <rect width="240" height="38" rx="12" fill="url(#cardGrad2)" />
    <rect y="26" width="240" height="12" fill="url(#cardGrad2)" />
    <text x="120" y="24" fill="#ffffff" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">STEP 2: Authentication</text>
    
    <text x="120" y="70" fill="#a78bfa" font-family="Segoe UI, Inter, sans-serif" font-size="28" text-anchor="middle">🔐</text>
    <text x="120" y="105" fill="#f1f5f9" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Login / Registration</text>
    <text x="120" y="128" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="11" text-anchor="middle">• Email/Password or OAuth</text>
    <text x="120" y="146" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="11" text-anchor="middle">• Redux Auth Token Stored</text>
    <text x="120" y="164" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="11" text-anchor="middle">• Redirect to Protected Route</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="600" y1="220" x2="650" y2="220" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)" />

  <!-- STEP 3: Main Dashboard -->
  <g transform="translate(660, 130)" filter="url(#dropShadow)">
    <rect width="240" height="180" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="2" />
    <rect width="240" height="38" rx="12" fill="url(#cardGrad3)" />
    <rect y="26" width="240" height="12" fill="url(#cardGrad3)" />
    <text x="120" y="24" fill="#ffffff" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">STEP 3: Dashboard Feed</text>
    
    <text x="120" y="70" fill="#22d3ee" font-family="Segoe UI, Inter, sans-serif" font-size="28" text-anchor="middle">📊</text>
    <text x="120" y="105" fill="#f1f5f9" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Personalized Hub</text>
    <text x="120" y="128" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="11" text-anchor="middle">• Recent Listening History</text>
    <text x="120" y="146" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="11" text-anchor="middle">• Recommended Categories</text>
    <text x="120" y="164" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="11" text-anchor="middle">• Quick Mood Selector Bar</text>
  </g>

  <!-- Connective Path from Step 3 down to Step 4 -->
  <path d="M 780 310 L 780 375 L 780 440" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)" />

  <!-- ================= ROW 2: Steps 4, 5, 6 (Right to Left) ================= -->

  <!-- STEP 4: Core Feature Execution -->
  <g transform="translate(660, 440)" filter="url(#dropShadow)">
    <rect width="240" height="180" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <rect width="240" height="38" rx="12" fill="url(#cardGrad4)" />
    <rect y="26" width="240" height="12" fill="url(#cardGrad4)" />
    <text x="120" y="24" fill="#ffffff" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">STEP 4: Core AI Feature</text>
    
    <text x="120" y="70" fill="#34d399" font-family="Segoe UI, Inter, sans-serif" font-size="28" text-anchor="middle">⚡</text>
    <text x="120" y="105" fill="#f1f5f9" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Mood Playlist Generator</text>
    <text x="120" y="128" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="11" text-anchor="middle">• Select: Gym / Focus / Chill</text>
    <text x="120" y="146" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="11" text-anchor="middle">• Generates 20 Tailored Tracks</text>
    <text x="120" y="164" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="11" text-anchor="middle">• Real-time State Updates</text>
  </g>

  <!-- Arrow 4 -> 5 (Going Left) -->
  <line x1="660" y1="530" x2="610" y2="530" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)" />

  <!-- STEP 5: Audio Player Interaction -->
  <g transform="translate(360, 440)" filter="url(#dropShadow)">
    <rect width="240" height="180" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <rect width="240" height="38" rx="12" fill="url(#cardGrad5)" />
    <rect y="26" width="240" height="12" fill="url(#cardGrad5)" />
    <text x="120" y="24" fill="#ffffff" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">STEP 5: Player Interaction</text>
    
    <text x="120" y="70" fill="#fbbf24" font-family="Segoe UI, Inter, sans-serif" font-size="28" text-anchor="middle">🎵</text>
    <text x="120" y="105" fill="#f1f5f9" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Streaming &amp; Library</text>
    <text x="120" y="128" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="11" text-anchor="middle">• Audio Play/Pause, Seek Bar</text>
    <text x="120" y="146" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="11" text-anchor="middle">• Favorite Songs (Redux action)</text>
    <text x="120" y="164" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="11" text-anchor="middle">• Save Custom Playlist</text>
  </g>

  <!-- Arrow 5 -> 6 (Going Left) -->
  <line x1="360" y1="530" x2="310" y2="530" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)" />

  <!-- STEP 6: Profile & Logout -->
  <g transform="translate(60, 440)" filter="url(#dropShadow)">
    <rect width="240" height="180" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2" />
    <rect width="240" height="38" rx="12" fill="url(#cardGrad6)" />
    <rect y="26" width="240" height="12" fill="url(#cardGrad6)" />
    <text x="120" y="24" fill="#ffffff" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">STEP 6: Session Exit</text>
    
    <text x="120" y="70" fill="#f87171" font-family="Segoe UI, Inter, sans-serif" font-size="28" text-anchor="middle">🔒</text>
    <text x="120" y="105" fill="#f1f5f9" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="600" text-anchor="middle">User Logout &amp; Clean up</text>
    <text x="120" y="128" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="11" text-anchor="middle">• Review Saved Library</text>
    <text x="120" y="146" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="11" text-anchor="middle">• Dispatches Redux logout()</text>
    <text x="120" y="164" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="11" text-anchor="middle">• Redirects to Landing Page</text>
  </g>

  <!-- Footer Tag -->
  <text x="480" y="685" fill="#64748b" font-family="Segoe UI, Inter, sans-serif" font-size="12" text-anchor="middle">
    Redux State Flow: authSlice (Login/Logout) ➔ playlistSlice (Mood Filter &amp; Tracks) ➔ playerSlice (Current Track &amp; Playback)
  </text>
</svg>
