  <g transform="translate(505, 222)" filter="url(#shadow3)">
    <rect width="475" height="110" fill="#ffffff" rx="10" />
    <text x="18" y="28" fill="#0f172a" font-family="'Segoe UI', Inter, sans-serif" font-size="14" font-weight="bold">📊 Job Search KPI Metrics</text>
    
    <g transform="translate(18, 42)">
      <rect x="0" y="0" width="135" height="52" fill="#f8fafc" stroke="#e2e8f0" rx="6" />
      <text x="67" y="24" fill="#4f46e5" font-family="Inter" font-size="18" font-weight="bold" text-anchor="middle">24</text>
      <text x="67" y="42" fill="#64748b" font-family="Inter" font-size="10" text-anchor="middle">Applications Sent</text>
      
      <rect x="150" y="0" width="135" height="52" fill="#f8fafc" stroke="#e2e8f0" rx="6" />
      <text x="217" y="24" fill="#059669" font-family="Inter" font-size="18" font-weight="bold" text-anchor="middle">6</text>
      <text x="217" y="42" fill="#64748b" font-family="Inter" font-size="10" text-anchor="middle">Interviews Scheduled</text>

      <rect x="300" y="0" width="135" height="52" fill="#f8fafc" stroke="#e2e8f0" rx="6" />
      <text x="367" y="24" fill="#d97706" font-family="Inter" font-size="18" font-weight="bold" text-anchor="middle">142</text>
      <text x="367" y="42" fill="#64748b" font-family="Inter" font-size="10" text-anchor="middle">Profile Views</text>
    </g>
  </g>

