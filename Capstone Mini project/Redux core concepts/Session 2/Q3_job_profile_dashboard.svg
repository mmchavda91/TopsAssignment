      <text x="40" y="17" fill="#4338ca" font-family="Inter" font-size="11" font-weight="600" text-anchor="middle">React.js</text>
      
      <rect x="90" y="0" width="115" height="26" fill="#eef2ff" stroke="#c7d2fe" rx="6" />
      <text x="147" y="17" fill="#4338ca" font-family="Inter" font-size="11" font-weight="600" text-anchor="middle">Redux Toolkit</text>
      
      <rect x="215" y="0" width="90" height="26" fill="#eef2ff" stroke="#c7d2fe" rx="6" />
      <text x="260" y="17" fill="#4338ca" font-family="Inter" font-size="11" font-weight="600" text-anchor="middle">JavaScript ES6</text>
      
      <rect x="315" y="0" width="105" height="26" fill="#eef2ff" stroke="#c7d2fe" rx="6" />
      <text x="367" y="17" fill="#4338ca" font-family="Inter" font-size="11" font-weight="600" text-anchor="middle">HTML5 / CSS3</text>
      
      <rect x="0" y="38" width="95" height="26" fill="#eef2ff" stroke="#c7d2fe" rx="6" />
      <text x="47" y="55" fill="#4338ca" font-family="Inter" font-size="11" font-weight="600" text-anchor="middle">REST APIs</text>
      
      <rect x="105" y="38" width="75" height="26" fill="#eef2ff" stroke="#c7d2fe" rx="6" />
      <text x="142" y="55" fill="#4338ca" font-family="Inter" font-size="11" font-weight="600" text-anchor="middle">Git / GitHub</text>

      <rect x="190" y="38" width="110" height="26" fill="#eef2ff" stroke="#c7d2fe" rx="6" />
      <text x="245" y="55" fill="#4338ca" font-family="Inter" font-size="11" font-weight="600" text-anchor="middle">Responsive UI</text>
