    <g transform="translate(20, 50)">
      <circle cx="8" cy="8" r="6" fill="#10b981" />
      <line x1="8" y1="18" x2="8" y2="64" stroke="#cbd5e1" stroke-width="2" />
      <text x="24" y="12" fill="#0f172a" font-family="Inter" font-size="12" font-weight="bold">Interview Round 2 Scheduled</text>
      <text x="24" y="28" fill="#475569" font-family="Inter" font-size="11">Tech Mahindra • Senior Frontend Role</text>
      <text x="24" y="44" fill="#94a3b8" font-family="Inter" font-size="10">📅 Tomorrow at 11:30 AM via Google Meet</text>
    </g>

    <!-- Timeline Item 2 -->
    <g transform="translate(20, 120)">
      <circle cx="8" cy="8" r="6" fill="#3b82f6" />
      <line x1="8" y1="18" x2="8" y2="64" stroke="#cbd5e1" stroke-width="2" />
      <text x="24" y="12" fill="#0f172a" font-family="Inter" font-size="12" font-weight="bold">Submitted React Machine Coding Assignment</text>
      <text x="24" y="28" fill="#475569" font-family="Inter" font-size="11">Infosys FinTech Labs • GitHub Pull Request #14</text>
      <text x="24" y="44" fill="#94a3b8" font-family="Inter" font-size="10">🕒 2 days ago</text>
    </g>

    <!-- Timeline Item 3 -->
    <g transform="translate(20, 190)">
      <circle cx="8" cy="8" r="6" fill="#8b5cf6" />
      <line x1="8" y1="18" x2="8" y2="64" stroke="#cbd5e1" stroke-width="2" />
      <text x="24" y="12" fill="#0f172a" font-family="Inter" font-size="12" font-weight="bold">Profile Viewed by Hiring Manager</text>
      <text x="24" y="28" fill="#475569" font-family="Inter" font-size="11">TCS Digital Products Division</text>
      <text x="24" y="44" fill="#94a3b8" font-family="Inter" font-size="10">🕒 4 days ago</text>
    </g>

    <!-- Timeline Item 4 -->
    <g transform="translate(20, 260)">
      <circle cx="8" cy="8" r="6" fill="#f59e0b" />
      <text x="24" y="12" fill="#0f172a" font-family="Inter" font-size="12" font-weight="bold">Updated Portfolio with Redux Capstone Project</text>
      <text x="24" y="28" fill="#475569" font-family="Inter" font-size="11">Added live demo links and GitHub repository</text>
      <text x="24" y="44" fill="#94a3b8" font-family="Inter" font-size="10">🕒 6 days ago</text>
