<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="#f8fafc" rx="8" />

  <!-- Spec Tag -->
  <rect width="1000" height="42" fill="#0f172a" rx="8 8 0 0" />
  <text x="24" y="26" fill="#ffffff" font-family="'Segoe UI', Inter, sans-serif" font-size="14" font-weight="bold">FIGMA AI PROMPT: "Generate layout for job profile dashboard" + CUSTOM EDITS</text>
  <text x="970" y="26" fill="#818cf8" font-family="monospace" font-size="12" text-anchor="end">Added: User Achievements &amp; Recent Activity</text>

  <!-- ================= 1. USER PROFILE HEADER CARD ================= -->
  <g transform="translate(20, 56)" filter="url(#shadow3)">
    <rect width="960" height="150" fill="#ffffff" rx="12" />
    
    <!-- Profile Banner Accent -->
    <rect width="960" height="48" fill="url(#headerGrad)" rx="12 12 0 0" />
    
    <!-- Avatar -->
    <circle cx="70" cy="72" r="38" fill="#ffffff" />
    <circle cx="70" cy="72" r="34" fill="#6366f1" />
    <text x="70" y="80" fill="#ffffff" font-family="Inter, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">MC</text>
    
    <!-- User Info -->
    <text x="125" y="78" fill="#0f172a" font-family="'Segoe UI', Inter, sans-serif" font-size="18" font-weight="bold">Mamta Chavda</text>
    <rect x="260" y="64" width="115" height="20" fill="#ecfdf5" rx="4" />
    <text x="317" y="78" fill="#059669" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">● Open to Work</text>
    
    <text x="125" y="98" fill="#475569" font-family="Inter, sans-serif" font-size="12">Frontend React Developer • Ahmedabad, Gujarat, India</text>
    <text x="125" y="118" fill="#64748b" font-family="Inter, sans-serif" font-size="11">Experience: 2+ Years • Profile Completeness: 95%</text>

    <!-- Header Actions -->
    <rect x="730" y="85" width="105" height="34" fill="#f1f5f9" stroke="#cbd5e1" rx="6" />
    <text x="782" y="106" fill="#334155" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">✏️ Edit Profile</text>
    
    <rect x="845" y="85" width="95" height="34" fill="#4f46e5" rx="6" />
    <text x="892" y="106" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">📄 View Resume</text>
  </g>

  <!-- ================= 2. LEFT COLUMN (Skills & Achievements) ================= -->
  <!-- 2A. Key Skills -->
  <g transform="translate(20, 222)" filter="url(#shadow3)">
    <rect width="465" height="175" fill="#ffffff" rx="10" />
    <text x="18" y="28" fill="#0f172a" font-family="'Segoe UI', Inter, sans-serif" font-size="14" font-weight="bold">🛠️ Core Skills &amp; Tech Stack</text>
    
    <!-- Skill Badges -->
    <g transform="translate(18, 45)">
