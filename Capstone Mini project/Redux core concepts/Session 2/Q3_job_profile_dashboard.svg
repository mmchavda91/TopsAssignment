    <!-- Achievement 3 -->
    <g transform="translate(18, 182)">
      <rect width="430" height="60" fill="#f5f3ff" stroke="#ddd6fe" rx="8" />
      <text x="15" y="38" font-size="24">⭐</text>
      <text x="50" y="26" fill="#0f172a" font-family="Inter" font-size="12" font-weight="bold">100-Day Continuous Coding Streak</text>
      <text x="50" y="44" fill="#64748b" font-family="Inter" font-size="10">Daily verified commits on GitHub repository.</text>
    </g>
