<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <!-- Canvas Background (Blueprint / Wireframe Canvas) -->
  <rect width="1000" height="700" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" rx="8" />

  <!-- Title / Spec Tag -->
  <rect x="0" y="0" width="1000" height="40" fill="#0f172a" rx="8 8 0 0" />
  <text x="24" y="25" fill="#f8fafc" font-family="'Segoe UI', Inter, Arial" font-size="14" font-weight="bold">LOW-FIDELITY WIREFRAME SPECIFICATION: FLIPKART-STYLE HOMEPAGE (LAYOUT &amp; PLACEMENT)</text>
  <text x="970" y="25" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="end">Figma / Whimsical Style • 1000x700px</text>

  <!-- ================= 1. TOP NAVIGATION BAR ================= -->
  <g transform="translate(20, 55)">
    <!-- Nav Container -->
    <rect width="960" height="60" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 2" rx="6" />
    
    <!-- Logo Placeholder -->
    <rect x="20" y="12" width="130" height="36" fill="#e2e8f0" stroke="#64748b" stroke-width="1" rx="4" />
    <text x="85" y="34" fill="#334155" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">[LOGO: Flipkart]</text>
    
    <!-- Search Bar Placeholder -->
    <rect x="170" y="12" width="460" height="36" fill="#ffffff" stroke="#64748b" stroke-width="1.5" rx="4" />
    <text x="185" y="34" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">🔍 Search for products, brands and more...</text>
    <rect x="560" y="16" width="60" height="28" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" rx="3" />
    <text x="590" y="34" fill="#475569" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Search</text>
    
    <!-- Nav Actions -->
    <!-- Login Btn -->
    <rect x="650" y="14" width="90" height="32" fill="#e2e8f0" stroke="#475569" stroke-width="1" rx="4" />
    <text x="695" y="34" fill="#1e293b" font-family="Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">👤 Login</text>
    
    <!-- Become a Seller -->
    <rect x="755" y="14" width="115" height="32" fill="#ffffff" stroke="#94a3b8" stroke-width="1" rx="4" />
    <text x="812" y="34" fill="#475569" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">🏪 Become Seller</text>
    
    <!-- Cart -->
    <rect x="885" y="14" width="60" height="32" fill="#e2e8f0" stroke="#475569" stroke-width="1" rx="4" />
    <text x="915" y="34" fill="#1e293b" font-family="Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🛒 Cart</text>
  </g>

  <!-- ================= 2. QUICK CATEGORIES ROW ================= -->
  <g transform="translate(20, 125)">
    <rect width="960" height="35" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="4" />
    <!-- Category Items -->
    <text x="60" y="22" fill="#475569" font-family="Arial" font-size="11" text-anchor="middle">📱 Grocery</text>
    <text x="170" y="22" fill="#475569" font-family="Arial" font-size="11" text-anchor="middle">📲 Mobiles</text>
    <text x="290" y="22" fill="#475569" font-family="Arial" font-size="11" text-anchor="middle">👗 Fashion ▾</text>
    <text x="410" y="22" fill="#475569" font-family="Arial" font-size="11" text-anchor="middle">💻 Electronics ▾</text>
    <text x="540" y="22" fill="#475569" font-family="Arial" font-size="11" text-anchor="middle">🛋️ Home &amp; Kitchen ▾</text>
    <text x="680" y="22" fill="#475569" font-family="Arial" font-size="11" text-anchor="middle">📺 Appliances</text>
    <text x="800" y="22" fill="#475569" font-family="Arial" font-size="11" text-anchor="middle">✈️ Travel</text>
    <text x="910" y="22" fill="#475569" font-family="Arial" font-size="11" text-anchor="middle">🧸 Toys &amp; More</text>
  </g>

  <!-- ================= 3. HERO / PROMO BANNER ================= -->
  <g transform="translate(20, 170)">
    <rect width="960" height="70" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 3" rx="4" />
    <line x1="0" y1="0" x2="960" y2="70" stroke="#cbd5e1" stroke-width="1" />
    <line x1="0" y1="70" x2="960" y2="0" stroke="#cbd5e1" stroke-width="1" />
    <rect x="360" y="18" width="240" height="34" fill="#ffffff" stroke="#64748b" stroke-width="1" rx="4" />
    <text x="480" y="40" fill="#334155" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      [CAROUSEL PROMO BANNER: Top Deals]
    </text>
  </g>

  <!-- ================= 4. SIDEBAR FILTER SECTION (LEFT) ================= -->
  <g transform="translate(20, 255)">
    <!-- Sidebar Box -->
    <rect width="240" height="425" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" rx="6" />
    
    <!-- Filter Header -->
    <rect width="240" height="38" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="6 6 0 0" />
    <text x="16" y="24" fill="#0f172a" font-family="Arial, sans-serif" font-size="13" font-weight="bold">FILTERS</text>
    <text x="224" y="24" fill="#64748b" font-family="Arial, sans-serif" font-size="11" text-anchor="end">Clear All</text>

    <!-- Filter 1: Categories -->
    <text x="16" y="60" fill="#1e293b" font-family="Arial, sans-serif" font-size="12" font-weight="bold">CATEGORIES</text>
    <text x="24" y="80" fill="#475569" font-family="Arial, sans-serif" font-size="11">▾ Electronics</text>
    <text x="36" y="98" fill="#64748b" font-family="Arial, sans-serif" font-size="10">• Audio &amp; Headphones</text>
    <text x="36" y="114" fill="#64748b" font-family="Arial, sans-serif" font-size="10">• Smart Watches</text>
    <text x="36" y="130" fill="#64748b" font-family="Arial, sans-serif" font-size="10">• Laptops &amp; Tablets</text>

    <line x1="16" y1="145" x2="224" y2="145" stroke="#e2e8f0" stroke-width="1" />

    <!-- Filter 2: Price Range Slider -->
    <text x="16" y="168" fill="#1e293b" font-family="Arial, sans-serif" font-size="12" font-weight="bold">PRICE RANGE</text>
    <!-- Slider Track -->
    <line x1="20" y1="190" x2="220" y2="190" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    <circle cx="50" cy="190" r="6" fill="#475569" />
    <circle cx="180" cy="190" r="6" fill="#475569" />
    <rect x="20" y="205" width="80" height="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="3" />
    <text x="60" y="221" fill="#475569" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Min: ₹500</text>
    <text x="120" y="221" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">to</text>
    <rect x="140" y="205" width="80" height="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="3" />
    <text x="180" y="221" fill="#475569" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Max: ₹10,000</text>

    <line x1="16" y1="242" x2="224" y2="242" stroke="#e2e8f0" stroke-width="1" />

    <!-- Filter 3: Brand Checkboxes -->
    <text x="16" y="265" fill="#1e293b" font-family="Arial, sans-serif" font-size="12" font-weight="bold">BRAND</text>
    
    <rect x="20" y="280" width="12" height="12" fill="#475569" rx="2" />
    <text x="40" y="291" fill="#334155" font-family="Arial, sans-serif" font-size="11">[✓] Sony</text>
    
    <rect x="20" y="302" width="12" height="12" fill="#ffffff" stroke="#94a3b8" rx="2" />
    <text x="40" y="313" fill="#475569" font-family="Arial, sans-serif" font-size="11">[ ] boAt</text>
    
    <rect x="20" y="324" width="12" height="12" fill="#ffffff" stroke="#94a3b8" rx="2" />
    <text x="40" y="335" fill="#475569" font-family="Arial, sans-serif" font-size="11">[ ] JBL</text>

    <line x1="16" y1="350" x2="224" y2="350" stroke="#e2e8f0" stroke-width="1" />

    <!-- Filter 4: Customer Ratings -->
    <text x="16" y="372" fill="#1e293b" font-family="Arial, sans-serif" font-size="12" font-weight="bold">CUSTOMER RATINGS</text>
    <text x="20" y="394" fill="#475569" font-family="Arial, sans-serif" font-size="11">[✓] 4★ &amp; above</text>
    <text x="20" y="412" fill="#475569" font-family="Arial, sans-serif" font-size="11">[ ] 3★ &amp; above</text>
  </g>

  <!-- ================= 5. MAIN CONTENT PRODUCT GRID ================= -->
  <g transform="translate(280, 255)">
    <!-- Grid Top Sort Bar -->
    <rect width="700" height="38" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="4" />
    <text x="16" y="24" fill="#1e293b" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Showing 1 – 12 of 3,420 results</text>
    <text x="420" y="24" fill="#64748b" font-family="Arial, sans-serif" font-size="11">Sort By:</text>
    <text x="475" y="24" fill="#0f172a" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Relevance</text>
    <text x="545" y="24" fill="#64748b" font-family="Arial, sans-serif" font-size="11">Popularity</text>
    <text x="615" y="24" fill="#64748b" font-family="Arial, sans-serif" font-size="11">Price -- Low to High</text>

    <!-- Product Card 1 -->
    <g transform="translate(0, 50)">
      <rect width="220" height="330" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="6" />
      <!-- Image box with X wireframe lines -->
      <rect x="15" y="15" width="190" height="150" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="4" />
      <line x1="15" y1="15" x2="205" y2="165" stroke="#cbd5e1" stroke-width="1" />
      <line x1="15" y1="165" x2="205" y2="15" stroke="#cbd5e1" stroke-width="1" />
      <text x="110" y="95" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">[PRODUCT IMAGE]</text>
      
      <!-- Content -->
      <text x="15" y="185" fill="#1e293b" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Wireless ANC Headphones</text>
      <text x="15" y="202" fill="#64748b" font-family="Arial, sans-serif" font-size="10">Noise cancellation, 40h battery</text>
      
      <!-- Rating badge -->
      <rect x="15" y="215" width="46" height="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" rx="3" />
      <text x="38" y="228" fill="#1e293b" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">4.4 ★</text>
      <text x="68" y="228" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10">(12,450)</text>

      <!-- Price -->
      <text x="15" y="260" fill="#0f172a" font-family="Arial, sans-serif" font-size="15" font-weight="bold">₹2,499</text>
      <text x="75" y="260" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" text-decoration="line-through">₹4,999</text>
      <text x="130" y="260" fill="#475569" font-family="Arial, sans-serif" font-size="11" font-weight="bold">50% off</text>
      
      <!-- Add to Cart CTA -->
      <rect x="15" y="280" width="190" height="34" fill="#e2e8f0" stroke="#475569" stroke-width="1" rx="4" />
      <text x="110" y="302" fill="#0f172a" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ADD TO CART</text>
    </g>

    <!-- Product Card 2 -->
    <g transform="translate(240, 50)">
      <rect width="220" height="330" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="6" />
      <rect x="15" y="15" width="190" height="150" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="4" />
      <line x1="15" y1="15" x2="205" y2="165" stroke="#cbd5e1" stroke-width="1" />
      <line x1="15" y1="165" x2="205" y2="15" stroke="#cbd5e1" stroke-width="1" />
      <text x="110" y="95" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">[PRODUCT IMAGE]</text>
      
      <text x="15" y="185" fill="#1e293b" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Mechanical Keyboard RGB</text>
      <text x="15" y="202" fill="#64748b" font-family="Arial, sans-serif" font-size="10">Hot-swappable tactile switches</text>
      
      <rect x="15" y="215" width="46" height="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" rx="3" />
      <text x="38" y="228" fill="#1e293b" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">4.6 ★</text>
      <text x="68" y="228" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10">(3,820)</text>

      <text x="15" y="260" fill="#0f172a" font-family="Arial, sans-serif" font-size="15" font-weight="bold">₹3,899</text>
      <text x="75" y="260" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" text-decoration="line-through">₹5,499</text>
      <text x="130" y="260" fill="#475569" font-family="Arial, sans-serif" font-size="11" font-weight="bold">29% off</text>
      
      <rect x="15" y="280" width="190" height="34" fill="#e2e8f0" stroke="#475569" stroke-width="1" rx="4" />
      <text x="110" y="302" fill="#0f172a" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ADD TO CART</text>
    </g>

    <!-- Product Card 3 -->
    <g transform="translate(480, 50)">
      <rect width="220" height="330" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="6" />
      <rect x="15" y="15" width="190" height="150" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="4" />
      <line x1="15" y1="15" x2="205" y2="165" stroke="#cbd5e1" stroke-width="1" />
      <line x1="15" y1="165" x2="205" y2="15" stroke="#cbd5e1" stroke-width="1" />
      <text x="110" y="95" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">[PRODUCT IMAGE]</text>
      
      <text x="15" y="185" fill="#1e293b" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Smart Fitness Tracker Pro</text>
      <text x="15" y="202" fill="#64748b" font-family="Arial, sans-serif" font-size="10">AMOLED screen, SpO2 &amp; Sleep</text>
      
      <rect x="15" y="215" width="46" height="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" rx="3" />
      <text x="38" y="228" fill="#1e293b" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">4.2 ★</text>
      <text x="68" y="228" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10">(8,190)</text>

      <text x="15" y="260" fill="#0f172a" font-family="Arial, sans-serif" font-size="15" font-weight="bold">₹1,799</text>
      <text x="75" y="260" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" text-decoration="line-through">₹3,999</text>
      <text x="130" y="260" fill="#475569" font-family="Arial, sans-serif" font-size="11" font-weight="bold">55% off</text>
      
      <rect x="15" y="280" width="190" height="34" fill="#e2e8f0" stroke="#475569" stroke-width="1" rx="4" />
      <text x="110" y="302" fill="#0f172a" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ADD TO CART</text>
    </g>
  </g>
</svg>
