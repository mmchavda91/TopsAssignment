<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="spotifyGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ed760" />
      <stop offset="100%" stop-color="#1db954" />
    </linearGradient>
    <linearGradient id="stepGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="stepGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="stepGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="stepGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Marker Arrow -->
    <marker id="journeyArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#1db954" />
    </marker>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="680" fill="#121212" rx="8" />

  <!-- Spec Tag -->
  <rect width="1000" height="42" fill="#000000" rx="8 8 0 0" />
  <text x="24" y="26" fill="#ffffff" font-family="'Segoe UI', Inter, sans-serif" font-size="14" font-weight="bold">USER JOURNEY MAP: NEW USER SIGN-UP &amp; MUSIC PLAYLIST EXPLORATION (SPOTIFY)</text>
  <text x="970" y="26" fill="#1ed760" font-family="monospace" font-size="12" font-weight="bold" text-anchor="end">4 Key Steps / Screen Transitions</text>

  <!-- ================= 4 SCREENS PROGRESSION ================= -->

  <!-- STEP 1: Welcome & Account Creation -->
  <g transform="translate(30, 80)" filter="url(#cardShadow)">
    <rect width="210" height="420" fill="#181818" stroke="#333333" stroke-width="1.5" rx="12" />
    <rect width="210" height="38" fill="url(#stepGrad1)" rx="12 12 0 0" />
    <text x="105" y="24" fill="#ffffff" font-family="Inter" font-size="12" font-weight="bold" text-anchor="middle">SCREEN 1: Sign Up / Welcome</text>

    <!-- Wireframe Mockup -->
    <rect x="20" y="55" width="170" height="80" fill="#242424" stroke="#404040" rx="6" />
    <text x="105" y="90" fill="#1ed760" font-size="28" text-anchor="middle">🎵</text>
    <text x="105" y="115" fill="#ffffff" font-family="Inter" font-size="11" font-weight="bold" text-anchor="middle">Millions of songs. Free.</text>

    <!-- Input fields -->
    <rect x="20" y="150" width="170" height="26" fill="#282828" stroke="#404040" rx="4" />
    <text x="30" y="167" fill="#888888" font-family="Inter" font-size="10">What's your email?</text>

    <rect x="20" y="185" width="170" height="26" fill="#282828" stroke="#404040" rx="4" />
    <text x="30" y="202" fill="#888888" font-family="Inter" font-size="10">Create a password</text>

    <rect x="20" y="225" width="170" height="32" fill="#1ed760" rx="16" />
    <text x="105" y="245" fill="#000000" font-family="Inter" font-size="11" font-weight="bold" text-anchor="middle">Sign Up Free</text>

    <text x="105" y="275" fill="#777777" font-family="Inter" font-size="9" text-anchor="middle">or continue with Google</text>

    <!-- Step Purpose Callout -->
    <rect x="15" y="300" width="180" height="105" fill="#121212" stroke="#3b82f6" stroke-width="1" rx="6" />
    <text x="25" y="320" fill="#60a5fa" font-family="Inter" font-size="11" font-weight="bold">🎯 Screen Purpose:</text>
    <text x="25" y="338" fill="#cccccc" font-family="Inter" font-size="10">Frictionless entry point.</text>
    <text x="25" y="354" fill="#aaaaaa" font-family="Inter" font-size="9">• Collects credentials</text>
    <text x="25" y="370" fill="#aaaaaa" font-family="Inter" font-size="9">• Social 1-tap OAuth</text>
    <text x="25" y="386" fill="#aaaaaa" font-family="Inter" font-size="9">• Zero upfront payment</text>
  </g>

  <!-- Transition Arrow 1 -> 2 -->
  <line x1="245" y1="290" x2="275" y2="290" stroke="#1db954" stroke-width="3" marker-end="url(#journeyArrow)" />
  <text x="260" y="280" fill="#1ed760" font-family="Inter" font-size="10" font-weight="bold" text-anchor="middle">Next</text>

  <!-- STEP 2: Onboarding - Music Preferences -->
  <g transform="translate(280, 80)" filter="url(#cardShadow)">
    <rect width="210" height="420" fill="#181818" stroke="#333333" stroke-width="1.5" rx="12" />
    <rect width="210" height="38" fill="url(#stepGrad2)" rx="12 12 0 0" />
    <text x="105" y="24" fill="#ffffff" font-family="Inter" font-size="12" font-weight="bold" text-anchor="middle">SCREEN 2: Taste Onboarding</text>

    <!-- Content -->
    <text x="20" y="65" fill="#ffffff" font-family="Inter" font-size="11" font-weight="bold">Choose 3+ Artists or Genres</text>
    <text x="20" y="80" fill="#888888" font-family="Inter" font-size="9">Helps us curate your daily mix.</text>

    <!-- Genre chips -->
    <rect x="20" y="95" width="78" height="32" fill="#8b5cf6" rx="6" />
    <text x="59" y="115" fill="#ffffff" font-family="Inter" font-size="10" font-weight="bold" text-anchor="middle">🎸 Rock ✓</text>

    <rect x="105" y="95" width="85" height="32" fill="#282828" stroke="#444" rx="6" />
    <text x="147" y="115" fill="#ffffff" font-family="Inter" font-size="10" text-anchor="middle">🎧 Hip-Hop</text>

    <rect x="20" y="135" width="85" height="32" fill="#8b5cf6" rx="6" />
    <text x="62" y="155" fill="#ffffff" font-family="Inter" font-size="10" font-weight="bold" text-anchor="middle">☕ Lo-Fi ✓</text>

    <rect x="112" y="135" width="78" height="32" fill="#282828" stroke="#444" rx="6" />
    <text x="151" y="155" fill="#ffffff" font-family="Inter" font-size="10" text-anchor="middle">🎹 Indie</text>

    <rect x="20" y="175" width="80" height="32" fill="#8b5cf6" rx="6" />
    <text x="60" y="195" fill="#ffffff" font-family="Inter" font-size="10" font-weight="bold" text-anchor="middle">⚡ Pop ✓</text>

    <rect x="108" y="175" width="82" height="32" fill="#282828" stroke="#444" rx="6" />
    <text x="149" y="195" fill="#ffffff" font-family="Inter" font-size="10" text-anchor="middle">🎻 Classical</text>

    <rect x="20" y="225" width="170" height="32" fill="#1ed760" rx="16" />
    <text x="105" y="245" fill="#000000" font-family="Inter" font-size="11" font-weight="bold" text-anchor="middle">Build My Library ➔</text>

    <!-- Step Purpose Callout -->
    <rect x="15" y="300" width="180" height="105" fill="#121212" stroke="#8b5cf6" stroke-width="1" rx="6" />
    <text x="25" y="320" fill="#a78bfa" font-family="Inter" font-size="11" font-weight="bold">🎯 Screen Purpose:</text>
    <text x="25" y="338" fill="#cccccc" font-family="Inter" font-size="10">Personalization anchor.</text>
    <text x="25" y="354" fill="#aaaaaa" font-family="Inter" font-size="9">• Overcomes cold start</text>
    <text x="25" y="370" fill="#aaaaaa" font-family="Inter" font-size="9">• Tailors recommendation</text>
    <text x="25" y="386" fill="#aaaaaa" font-family="Inter" font-size="9">• Builds immediate trust</text>
  </g>

  <!-- Transition Arrow 2 -> 3 -->
  <line x1="495" y1="290" x2="525" y2="290" stroke="#1db954" stroke-width="3" marker-end="url(#journeyArrow)" />
  <text x="510" y="280" fill="#1ed760" font-family="Inter" font-size="10" font-weight="bold" text-anchor="middle">Load</text>

  <!-- STEP 3: Personalized Home Dashboard -->
  <g transform="translate(530, 80)" filter="url(#cardShadow)">
    <rect width="210" height="420" fill="#181818" stroke="#333333" stroke-width="1.5" rx="12" />
    <rect width="210" height="38" fill="url(#stepGrad3)" rx="12 12 0 0" />
    <text x="105" y="24" fill="#ffffff" font-family="Inter" font-size="12" font-weight="bold" text-anchor="middle">SCREEN 3: Personalized Feed</text>

    <text x="20" y="65" fill="#ffffff" font-family="Inter" font-size="12" font-weight="bold">Good Afternoon, Mamta</text>
    
    <!-- Mini Recommended Grids -->
    <rect x="20" y="80" width="80" height="40" fill="#282828" rx="4" />
    <text x="60" y="104" fill="#ffffff" font-family="Inter" font-size="9" text-anchor="middle">Daily Mix 1</text>

    <rect x="110" y="80" width="80" height="40" fill="#282828" rx="4" />
    <text x="150" y="104" fill="#ffffff" font-family="Inter" font-size="9" text-anchor="middle">Lo-Fi Beats</text>

    <text x="20" y="140" fill="#ffffff" font-family="Inter" font-size="11" font-weight="bold">Made For You</text>

    <!-- Playlist Card -->
    <rect x="20" y="155" width="170" height="85" fill="#242424" stroke="#333333" rx="6" />
    <rect x="30" y="165" width="45" height="45" fill="#059669" rx="4" />
    <text x="52" y="192" fill="#ffffff" font-size="18" text-anchor="middle">🎧</text>
    <text x="85" y="180" fill="#ffffff" font-family="Inter" font-size="11" font-weight="bold">Focus Deep Work</text>
    <text x="85" y="195" fill="#888888" font-family="Inter" font-size="9">50 Songs • 2h 45m</text>
    <rect x="85" y="208" width="80" height="22" fill="#1ed760" rx="11" />
    <text x="125" y="222" fill="#000000" font-family="Inter" font-size="9" font-weight="bold" text-anchor="middle">▶ Open Playlist</text>

    <!-- Step Purpose Callout -->
    <rect x="15" y="300" width="180" height="105" fill="#121212" stroke="#10b981" stroke-width="1" rx="6" />
    <text x="25" y="320" fill="#34d399" font-family="Inter" font-size="11" font-weight="bold">🎯 Screen Purpose:</text>
    <text x="25" y="338" fill="#cccccc" font-family="Inter" font-size="10">Primary discovery hub.</text>
    <text x="25" y="354" fill="#aaaaaa" font-family="Inter" font-size="9">• Instant gratification</text>
    <text x="25" y="370" fill="#aaaaaa" font-family="Inter" font-size="9">• Algorithmic playlists</text>
    <text x="25" y="386" fill="#aaaaaa" font-family="Inter" font-size="9">• Seamless browse menu</text>
  </g>

  <!-- Transition Arrow 3 -> 4 -->
  <line x1="745" y1="290" x2="775" y2="290" stroke="#1db954" stroke-width="3" marker-end="url(#journeyArrow)" />
  <text x="760" y="280" fill="#1ed760" font-family="Inter" font-size="10" font-weight="bold" text-anchor="middle">Play</text>

  <!-- STEP 4: Playlist Detail & Player Screen -->
  <g transform="translate(780, 80)" filter="url(#cardShadow)">
    <rect width="190" height="420" fill="#181818" stroke="#333333" stroke-width="1.5" rx="12" />
    <rect width="190" height="38" fill="url(#stepGrad4)" rx="12 12 0 0" />
    <text x="95" y="24" fill="#ffffff" font-family="Inter" font-size="12" font-weight="bold" text-anchor="middle">SCREEN 4: Player &amp; Detail</text>

    <!-- Album art -->
    <rect x="20" y="55" width="150" height="90" fill="#d97706" rx="6" />
    <text x="95" y="110" fill="#ffffff" font-size="34" text-anchor="middle">📻</text>

    <text x="20" y="165" fill="#ffffff" font-family="Inter" font-size="11" font-weight="bold">Synthwave Coding Chill</text>
    <text x="20" y="180" fill="#888888" font-family="Inter" font-size="9">Artist: CyberWave Ensemble</text>

    <!-- Player Controls -->
    <line x1="20" y1="198" x2="170" y2="198" stroke="#444444" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="198" x2="85" y2="198" stroke="#1ed760" stroke-width="3" stroke-linecap="round" />
    <circle cx="85" cy="198" r="4" fill="#ffffff" />

    <text x="20" y="215" fill="#777777" font-family="Inter" font-size="8">1:24</text>
    <text x="170" y="215" fill="#777777" font-family="Inter" font-size="8" text-anchor="end">3:42</text>

    <!-- Play/Pause -->
    <circle cx="95" cy="242" r="16" fill="#1ed760" />
    <text x="95" y="248" fill="#000000" font-size="14" font-weight="bold" text-anchor="middle">⏸</text>
    <text x="50" y="247" fill="#ffffff" font-size="12">⏮</text>
    <text x="140" y="247" fill="#ffffff" font-size="12">⏭</text>
    <text x="165" y="165" fill="#1ed760" font-size="12">💚</text>

    <!-- Step Purpose Callout -->
    <rect x="15" y="300" width="160" height="105" fill="#121212" stroke="#f59e0b" stroke-width="1" rx="6" />
    <text x="25" y="320" fill="#fbbf24" font-family="Inter" font-size="11" font-weight="bold">🎯 Screen Purpose:</text>
    <text x="25" y="338" fill="#cccccc" font-family="Inter" font-size="10">Core value consumption.</text>
    <text x="25" y="354" fill="#aaaaaa" font-family="Inter" font-size="9">• Audio playback control</text>
    <text x="25" y="370" fill="#aaaaaa" font-family="Inter" font-size="9">• Save/Like track to state</text>
    <text x="25" y="386" fill="#aaaaaa" font-family="Inter" font-size="9">• Sticky background bar</text>
  </g>

  <!-- ================= BOTTOM JOURNEY FLOW SUMMARY ================= -->
  <g transform="translate(30, 525)">
    <rect width="940" height="135" fill="#181818" stroke="#282828" rx="10" />
    <text x="20" y="28" fill="#1ed760" font-family="'Segoe UI', Inter, sans-serif" font-size="13" font-weight="bold">
      🔄 SUMMARY OF USER FLOW &amp; SCREEN TRANSITIONS:
    </text>
    
    <g transform="translate(20, 45)" font-family="Inter, sans-serif" font-size="11" fill="#b3b3b3">
      <text x="0" y="15">
        <tspan fill="#ffffff" font-weight="bold">1. Entry &amp; Sign-Up:</tspan> Landing Page ➔ Enter Email / Google Auth ➔ Form Validation ➔ Token issued.
      </text>
      <text x="0" y="35">
        <tspan fill="#ffffff" font-weight="bold">2. Taste Onboarding:</tspan> Select 3+ favorite artists/genres ➔ Saves preference vector to user profile.
      </text>
      <text x="0" y="55">
        <tspan fill="#ffffff" font-weight="bold">3. Personalized Dashboard:</tspan> Auto-routes to Home feed ➔ Loads Daily Mixes, Recommended Playlists &amp; Recents.
      </text>
      <text x="0" y="75">
        <tspan fill="#ffffff" font-weight="bold">4. Core Feature Completion:</tspan> User clicks playlist ➔ Opens detail view ➔ Clicks Play ➔ Sticky bottom player activates audio stream.
      </text>
    </g>
  </g>
</svg>
