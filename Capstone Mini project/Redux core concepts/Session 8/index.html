<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="description" content="Session 8: Responsive Testing, Cross-Browser Compatibility, Redux Auth & Google Lighthouse Audit (Q1 to Q5)" />
  <title>Session 8: Responsive Design, Cross-Browser & Lighthouse Audit (Q1 - Q5)</title>

  <!-- Google Fonts: Inter with font-display: swap (Q5 ChatGPT Optimization) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- React 18 & ReactDOM via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Q2 Cross-Browser Standardized Reset & Scrollbar Styles (Chrome & Firefox) -->
  <style>
    /* CSS Reset for consistent cross-browser baseline */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      max-width: 100%;
      overflow-x: hidden; /* Q1 Fix: Prevents horizontal scrolling on mobile */
      background-color: #030712;
      color: #f3f4f6;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      /* Q2 Fix: Cross-browser font smoothing */
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      min-height: 100vh;
    }

    /* Q2 Cross-browser standard scrollbar for Firefox */
    * {
      scrollbar-width: thin;
      scrollbar-color: #3b82f6 #111827;
    }

    /* Q2 Cross-browser scrollbar for Chrome / WebKit */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: #111827;
    }
    ::-webkit-scrollbar-thumb {
      background: #3b82f6;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #2563eb;
    }

    /* Q2 Cross-browser button normalization */
    button {
      font-family: inherit;
      font-size: 100%;
      line-height: 1.15;
      margin: 0;
      cursor: pointer;
      border: none;
      outline: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    /* Firefox specific inner focus border reset */
    button::-moz-focus-inner {
      border: 0;
      padding: 0;
    }

    /* Code styling */
    code, pre {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Fluid images (Q4 Fix) */
    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
    .pulse-badge {
      animation: pulseGlow 2.5s infinite ease-in-out;
    }

    /* Glassmorphism card */
    .glass-card {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
    }

    .glass-card-hover:hover {
      border-color: rgba(59, 130, 246, 0.4);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 0 15px rgba(59, 130, 246, 0.15);
      transition: all 0.2s ease;
    }

    /* Modal overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 16px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React & Redux Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useReducer } = React;

    // --- Redux-like State Management ---
    const initialReduxState = {
      auth: {
        isAuthenticated: false,
        user: null,
        token: null,
        role: 'Student Developer'
      },
      ui: {
        activeTab: 'all',
        mobileMenuOpen: false,
        showLoginModal: false,
        viewportWidth: 1200,
        activeTheme: 'dark'
      },
      lighthouse: {
        isAuditing: false,
        hasAudited: false,
        mode: 'after', // 'before' | 'after'
        scores: {
          before: { performance: 68, accessibility: 74, bestPractices: 80, seo: 85 },
          after: { performance: 98, accessibility: 100, bestPractices: 100, seo: 100 }
        }
      }
    };

    function reduxReducer(state, action) {
      switch (action.type) {
        case 'LOGIN_SUCCESS':
          return {
            ...state,
            auth: {
              isAuthenticated: true,
              user: action.payload.user,
              token: 'jwt-session8-' + Math.random().toString(36).substring(2),
              role: action.payload.role || 'Redux Session 8 Lead'
            },
            ui: { ...state.ui, showLoginModal: false }
          };
        case 'LOGOUT':
          return {
            ...state,
            auth: { isAuthenticated: false, user: null, token: null, role: 'Guest' }
          };
        case 'SET_TAB':
          return { ...state, ui: { ...state.ui, activeTab: action.payload, mobileMenuOpen: false } };
        case 'TOGGLE_MOBILE_MENU':
          return { ...state, ui: { ...state.ui, mobileMenuOpen: !state.ui.mobileMenuOpen } };
        case 'TOGGLE_LOGIN_MODAL':
          return { ...state, ui: { ...state.ui, showLoginModal: action.payload } };
        case 'SET_VIEWPORT_WIDTH':
          return { ...state, ui: { ...state.ui, viewportWidth: action.payload } };
        case 'START_AUDIT':
          return { ...state, lighthouse: { ...state.lighthouse, isAuditing: true } };
        case 'FINISH_AUDIT':
          return { ...state, lighthouse: { ...state.lighthouse, isAuditing: false, hasAudited: true } };
        case 'SET_AUDIT_MODE':
          return { ...state, lighthouse: { ...state.lighthouse, mode: action.payload } };
        default:
          return state;
      }
    }

    // --- Main Application Component ---
    function App() {
      const [state, dispatch] = useReducer(reduxReducer, initialReduxState);
      const { auth, ui, lighthouse } = state;

      // Simulated auto-login option for quick review
      useEffect(() => {
        const savedUser = localStorage.getItem('redux_session8_user');
        if (savedUser) {
          try {
            const parsed = JSON.parse(savedUser);
            dispatch({ type: 'LOGIN_SUCCESS', payload: { user: parsed.email, role: 'Logged In Student' } });
          } catch(e) {}
        }
      }, []);

      const handleLogin = (email, password) => {
        localStorage.setItem('redux_session8_user', JSON.stringify({ email }));
        dispatch({ type: 'LOGIN_SUCCESS', payload: { user: email, role: 'Full Stack Engineer' } });
      };

      const handleLogout = () => {
        localStorage.removeItem('redux_session8_user');
        dispatch({ type: 'LOGOUT' });
      };

      return (
        <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
          
          {/* Header Navigation (Q1: Zero Horizontal Scroll & DevTools Emulation) */}
          <HeaderBar state={state} dispatch={dispatch} onOpenLogin={() => dispatch({ type: 'TOGGLE_LOGIN_MODAL', payload: true })} onLogout={handleLogout} />

          {/* Quick Notice Banner */}
          <div style={{ background: 'linear-gradient(90deg, #1e3a8a 0%, #1e1b4b 100%)', borderBottom: '1px solid rgba(59, 130, 246, 0.2)', padding: '10px 20px' }}>
            <div style={{ maxWidth: '1200px', margin: '0 auto', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: '8px', fontSize: '13px' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                <span className="pulse-badge" style={{ display: 'inline-block', width: '8px', height: '8px', borderRadius: '50%', backgroundColor: '#10b981' }}></span>
                <span style={{ fontWeight: 600, color: '#93c5fd' }}>Capstone Session 8:</span>
                <span style={{ color: '#e2e8f0' }}>Responsive Design, Cross-Browser (Chrome vs Firefox), and Google Lighthouse Audit</span>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                <span style={{ color: '#cbd5e1' }}>Redux Auth State:</span>
                {auth.isAuthenticated ? (
                  <span style={{ backgroundColor: '#065f46', color: '#6ee7b7', padding: '2px 8px', borderRadius: '4px', fontWeight: 600 }}>
                    🟢 Authenticated ({auth.user})
                  </span>
                ) : (
                  <span style={{ backgroundColor: '#78350f', color: '#fcd34d', padding: '2px 8px', borderRadius: '4px', fontWeight: 600 }}>
                    🟡 Guest Mode
                  </span>
                )}
              </div>
            </div>
          </div>

          {/* Main Content Area */}
          <main style={{ flex: 1, maxWidth: '1200px', width: '100%', margin: '0 auto', padding: '24px 16px' }}>

            {/* Questions Tabs */}
            <nav aria-label="Assignment Questions" style={{ display: 'flex', gap: '8px', overflowX: 'auto', paddingBottom: '12px', marginBottom: '24px', borderBottom: '1px solid #1f2937' }}>
              {[
                { id: 'all', label: '🌟 All Questions', desc: 'Full Dashboard' },
                { id: 'q1', label: '📱 Q1: iPhone X & Navbar', desc: 'Mobile Simulation' },
                { id: 'q2', label: '🌐 Q2: Chrome vs Firefox', desc: 'Button & Font Resets' },
                { id: 'q3', label: '⚡ Q3: Lighthouse Audit', desc: 'Perf & A11y Fixes' },
                { id: 'q4', label: '📐 Q4: 320px - 1200px', desc: 'Fluid Responsiveness' },
                { id: 'q5', label: '🤖 Q5: ChatGPT AI Fix', desc: 'AI Suggestion & Diff' },
                { id: 'redux', label: '📦 Redux State Inspector', desc: 'Global Store' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => dispatch({ type: 'SET_TAB', payload: tab.id })}
                  style={{
                    padding: '10px 16px',
                    borderRadius: '8px',
                    backgroundColor: ui.activeTab === tab.id ? '#2563eb' : '#111827',
                    color: ui.activeTab === tab.id ? '#ffffff' : '#9ca3af',
                    fontWeight: ui.activeTab === tab.id ? '700' : '500',
                    fontSize: '13px',
                    whiteSpace: 'nowrap',
                    border: '1px solid',
                    borderColor: ui.activeTab === tab.id ? '#3b82f6' : '#1f2937',
                    transition: 'all 0.15s ease'
                  }}
                >
                  {tab.label}
                </button>
              ))}
            </nav>

            {/* Tab Panels */}
            {ui.activeTab === 'all' && (
              <div style={{ display: 'flex', flexDirection: 'column', gap: '32px' }}>
                <Question1MobileSection />
                <Question2CrossBrowserSection />
                <Question3LighthouseSection lighthouse={lighthouse} dispatch={dispatch} />
                <Question4ResponsiveSection viewportWidth={ui.viewportWidth} setViewportWidth={(w) => dispatch({ type: 'SET_VIEWPORT_WIDTH', payload: w })} />
                <Question5ChatGptSection />
                <ReduxStoreViewer state={state} />
              </div>
            )}

            {ui.activeTab === 'q1' && <Question1MobileSection />}
            {ui.activeTab === 'q2' && <Question2CrossBrowserSection />}
            {ui.activeTab === 'q3' && <Question3LighthouseSection lighthouse={lighthouse} dispatch={dispatch} />}
            {ui.activeTab === 'q4' && <Question4ResponsiveSection viewportWidth={ui.viewportWidth} setViewportWidth={(w) => dispatch({ type: 'SET_VIEWPORT_WIDTH', payload: w })} />}
            {ui.activeTab === 'q5' && <Question5ChatGptSection />}
            {ui.activeTab === 'redux' && <ReduxStoreViewer state={state} />}

          </main>

          {/* Login Modal */}
          {ui.showLoginModal && (
            <LoginModal onClose={() => dispatch({ type: 'TOGGLE_LOGIN_MODAL', payload: false })} onLogin={handleLogin} />
          )}

          {/* Footer */}
          <footer style={{ backgroundColor: '#090d16', borderTop: '1px solid #1f2937', padding: '24px 16px', marginTop: 'auto', textAlign: 'center', fontSize: '13px', color: '#6b7280' }}>
            <div style={{ maxWidth: '1200px', margin: '0 auto', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '12px' }}>
              <div>
                <strong style={{ color: '#9ca3af' }}>Capstone Mini Project</strong> — Redux Core Concepts • Session 8
              </div>
              <div style={{ display: 'flex', gap: '16px' }}>
                <span>✅ Q1: Mobile DevTools</span>
                <span>✅ Q2: Chrome & Firefox</span>
                <span>✅ Q3: Lighthouse 98+</span>
                <span>✅ Q4: 320px - 1200px</span>
                <span>✅ Q5: ChatGPT Diff</span>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    // --- Header & Navbar Component (Q1 Solution: Zero Horizontal Scroll) ---
    function HeaderBar({ state, dispatch, onOpenLogin, onLogout }) {
      const { auth, ui } = state;

      return (
        <header style={{ backgroundColor: '#0b1120', borderBottom: '1px solid #1f2937', position: 'sticky', top: 0, zIndex: 100 }}>
          <div style={{ maxWidth: '1200px', margin: '0 auto', padding: '12px 16px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '16px' }}>
            
            {/* Brand Logo & Title */}
            <div style={{ display: 'flex', alignItems: 'center', gap: '12px', minWidth: 0 }}>
              <div style={{ width: '38px', height: '38px', borderRadius: '10px', background: 'linear-gradient(135deg, #3b82f6, #8b5cf6)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: '800', fontSize: '18px', color: '#fff', flexShrink: 0, boxShadow: '0 4px 12px rgba(59, 130, 246, 0.4)' }}>
                ⚛️
              </div>
              <div style={{ minWidth: 0 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                  <h1 style={{ fontSize: '17px', fontWeight: '800', letterSpacing: '-0.02em', color: '#ffffff', margin: 0, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                    Session 8 Responsive & Lighthouse
                  </h1>
                  <span style={{ fontSize: '11px', backgroundColor: '#1e3a8a', color: '#93c5fd', padding: '1px 6px', borderRadius: '4px', fontWeight: '600', flexShrink: 0 }}>
                    Redux Core
                  </span>
                </div>
                <p style={{ fontSize: '11px', color: '#94a3b8', margin: 0, display: 'none' }} className="header-subtitle">
                  Tested on iPhone X, Chrome, and Firefox
                </p>
              </div>
            </div>

            {/* Desktop Navigation Links (Hidden on small screens via media query / flex-wrap) */}
            <nav style={{ display: 'flex', alignItems: 'center', gap: '6px' }} className="desktop-nav">
              <button onClick={() => dispatch({ type: 'SET_TAB', payload: 'all' })} style={{ color: '#cbd5e1', padding: '6px 12px', borderRadius: '6px', fontSize: '13px', background: 'transparent' }}>
                All Tasks
              </button>
              <button onClick={() => dispatch({ type: 'SET_TAB', payload: 'q1' })} style={{ color: '#cbd5e1', padding: '6px 12px', borderRadius: '6px', fontSize: '13px', background: 'transparent' }}>
                iPhone X (Q1)
              </button>
              <button onClick={() => dispatch({ type: 'SET_TAB', payload: 'q2' })} style={{ color: '#cbd5e1', padding: '6px 12px', borderRadius: '6px', fontSize: '13px', background: 'transparent' }}>
                Cross-Browser (Q2)
              </button>
              <button onClick={() => dispatch({ type: 'SET_TAB', payload: 'q3' })} style={{ color: '#cbd5e1', padding: '6px 12px', borderRadius: '6px', fontSize: '13px', background: 'transparent' }}>
                Lighthouse (Q3)
              </button>
              <button onClick={() => dispatch({ type: 'SET_TAB', payload: 'q4' })} style={{ color: '#cbd5e1', padding: '6px 12px', borderRadius: '6px', fontSize: '13px', background: 'transparent' }}>
                320px-1200px (Q4)
              </button>
              <button onClick={() => dispatch({ type: 'SET_TAB', payload: 'q5' })} style={{ color: '#cbd5e1', padding: '6px 12px', borderRadius: '6px', fontSize: '13px', background: 'transparent' }}>
                ChatGPT Fix (Q5)
              </button>
            </nav>

            {/* Right Side: Auth / Login / Hamburger Button */}
            <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
              {auth.isAuthenticated ? (
                <div style={{ display: 'flex', alignItems: 'center', gap: '8px', backgroundColor: '#111827', padding: '4px 8px', borderRadius: '8px', border: '1px solid #1f2937' }}>
                  <div style={{ width: '28px', height: '28px', borderRadius: '50%', backgroundColor: '#2563eb', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '12px', fontWeight: '700' }}>
                    {auth.user ? auth.user.charAt(0).toUpperCase() : 'U'}
                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column' }}>
                    <span style={{ fontSize: '12px', fontWeight: '600', color: '#f3f4f6' }}>{auth.user}</span>
                    <span style={{ fontSize: '10px', color: '#10b981' }}>{auth.role}</span>
                  </div>
                  <button
                    onClick={onLogout}
                    title="Sign Out"
                    style={{ backgroundColor: '#374151', color: '#f87171', padding: '4px 8px', borderRadius: '4px', fontSize: '11px', fontWeight: '600', marginLeft: '4px' }}
                  >
                    Logout
                  </button>
                </div>
              ) : (
                <button
                  onClick={onOpenLogin}
                  style={{
                    backgroundColor: '#2563eb',
                    color: '#ffffff',
                    padding: '7px 14px',
                    borderRadius: '6px',
                    fontSize: '13px',
                    fontWeight: '600',
                    boxShadow: '0 2px 6px rgba(37, 99, 235, 0.4)'
                  }}
                >
                  🔑 Sign In
                </button>
              )}

              {/* Hamburger Button (Shows on mobile / iPhone X) */}
              <button
                onClick={() => dispatch({ type: 'TOGGLE_MOBILE_MENU' })}
                aria-label="Toggle Navigation Menu"
                style={{
                  width: '38px',
                  height: '38px',
                  borderRadius: '6px',
                  backgroundColor: '#1f2937',
                  color: '#ffffff',
                  fontSize: '20px',
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center'
                }}
              >
                {ui.mobileMenuOpen ? '✕' : '☰'}
              </button>
            </div>

          </div>

          {/* Mobile Drawer (Q1 Solution: Smooth vertical drop without horizontal scroll) */}
          {ui.mobileMenuOpen && (
            <div className="animate-fadeIn" style={{ backgroundColor: '#0f172a', borderTop: '1px solid #1e293b', padding: '16px', display: 'flex', flexDirection: 'column', gap: '8px' }}>
              <div style={{ fontSize: '11px', color: '#64748b', fontWeight: '700', textTransform: 'uppercase', letterSpacing: '0.05em' }}>
                Navigation Options
              </div>
              {[
                { id: 'all', label: '🌟 All Questions Dashboard' },
                { id: 'q1', label: '📱 Q1: iPhone X Mobile Simulator & Navbar' },
                { id: 'q2', label: '🌐 Q2: Chrome vs Firefox Cross-Browser Compatibility' },
                { id: 'q3', label: '⚡ Q3: Google Lighthouse Audit (Score 98+)' },
                { id: 'q4', label: '📐 Q4: Responsive Scaling (320px to 1200px)' },
                { id: 'q5', label: '🤖 Q5: ChatGPT AI Performance Fix' },
                { id: 'redux', label: '📦 Redux Store Inspector' }
              ].map(item => (
                <button
                  key={item.id}
                  onClick={() => dispatch({ type: 'SET_TAB', payload: item.id })}
                  style={{
                    textAlign: 'left',
                    padding: '10px 14px',
                    borderRadius: '8px',
                    backgroundColor: ui.activeTab === item.id ? '#2563eb' : '#1e293b',
                    color: ui.activeTab === item.id ? '#ffffff' : '#e2e8f0',
                    fontSize: '13px',
                    fontWeight: ui.activeTab === item.id ? '700' : '500',
                    width: '100%',
                    justifyContent: 'flex-start'
                  }}
                >
                  {item.label}
                </button>
              ))}
            </div>
          )}
        </header>
      );
    }

    // --- Login Modal Component ---
    function LoginModal({ onClose, onLogin }) {
      const [email, setEmail] = useState('mamta@dev.com');
      const [password, setPassword] = useState('Password123!');
      const [isLoading, setIsLoading] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        setIsLoading(true);
        setTimeout(() => {
          setIsLoading(false);
          onLogin(email, password);
        }, 400);
      };

      return (
        <div className="modal-overlay animate-fadeIn" onClick={onClose}>
          <div className="glass-card" style={{ width: '100%', maxWidth: '420px', padding: '24px', backgroundColor: '#0f172a' }} onClick={e => e.stopPropagation()}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                <span style={{ fontSize: '24px' }}>🔐</span>
                <div>
                  <h3 style={{ fontSize: '18px', fontWeight: '700', color: '#fff', margin: 0 }}>Redux Session 8 Sign In</h3>
                  <p style={{ fontSize: '12px', color: '#94a3b8', margin: 0 }}>Login to access all simulator tools</p>
                </div>
              </div>
              <button onClick={onClose} style={{ background: 'transparent', color: '#94a3b8', fontSize: '20px' }}>✕</button>
            </div>

            <form onSubmit={handleSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
              <div>
                <label style={{ display: 'block', fontSize: '12px', fontWeight: '600', color: '#cbd5e1', marginBottom: '6px' }}>
                  Email Address
                </label>
                <input
                  type="email"
                  value={email}
                  onChange={e => setEmail(e.target.value)}
                  required
                  style={{
                    width: '100%',
                    padding: '10px 12px',
                    backgroundColor: '#1e293b',
                    border: '1px solid #334155',
                    borderRadius: '6px',
                    color: '#ffffff',
                    fontSize: '14px',
                    outline: 'none'
                  }}
                />
              </div>

              <div>
                <label style={{ display: 'block', fontSize: '12px', fontWeight: '600', color: '#cbd5e1', marginBottom: '6px' }}>
                  Password
                </label>
                <input
                  type="password"
                  value={password}
                  onChange={e => setPassword(e.target.value)}
                  required
                  style={{
                    width: '100%',
                    padding: '10px 12px',
                    backgroundColor: '#1e293b',
                    border: '1px solid #334155',
                    borderRadius: '6px',
                    color: '#ffffff',
                    fontSize: '14px',
                    outline: 'none'
                  }}
                />
              </div>

              <div style={{ backgroundColor: '#1e1b4b', border: '1px solid #4338ca', borderRadius: '6px', padding: '10px', fontSize: '12px', color: '#c7d2fe' }}>
                💡 <strong>Demo Credentials</strong>: Pre-filled with <code>mamta@dev.com</code>. Click Sign In to test Redux Auth Slice dispatch!
              </div>

              <button
                type="submit"
                disabled={isLoading}
                style={{
                  backgroundColor: '#2563eb',
                  color: '#ffffff',
                  padding: '12px',

        { label: '375px (iPhone X)', width: 375 },
        { label: '768px (iPad Tablet)', width: 768 },
        { label: '1024px (Laptop)', width: 1024 },
        { label: '1200px (Desktop HD)', width: 1200 }
      ];

      return (
        <section className="glass-card" style={{ padding: '24px' }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: '12px', marginBottom: '16px' }}>
            <div>
              <div style={{ display: 'inline-block', backgroundColor: '#1e3a8a', color: '#93c5fd', fontSize: '11px', fontWeight: '700', padding: '3px 8px', borderRadius: '4px', marginBottom: '6px' }}>
                QUESTION 4
              </div>
              <h2 style={{ fontSize: '20px', fontWeight: '800', color: '#ffffff', margin: 0 }}>
                📐 Fluid Responsiveness: 320px to 1200px Dynamic Scaling
              </h2>
              <p style={{ fontSize: '13px', color: '#94a3b8', margin: '4px 0 0 0' }}>
                Interactive viewport width simulator demonstrating fluid grid scaling and un-broken layouts.
              </p>
            </div>

            {/* Current Width Badge */}
            <div style={{ backgroundColor: '#1e293b', padding: '6px 14px', borderRadius: '8px', border: '1px solid #334155' }}>
              <span style={{ fontSize: '12px', color: '#94a3b8' }}>Active Viewport: </span>
              <strong style={{ fontSize: '14px', color: '#38bdf8' }}>{viewportWidth}px</strong>
            </div>
          </div>

          {/* Preset Buttons & Slider */}
          <div style={{ display: 'flex', flexDirection: 'column', gap: '12px', marginBottom: '20px' }}>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px' }}>
              {presets.map(p => (
                <button
                  key={p.width}
                  onClick={() => setViewportWidth(p.width)}
                  style={{
                    backgroundColor: viewportWidth === p.width ? '#2563eb' : '#1f2937',
                    color: viewportWidth === p.width ? '#ffffff' : '#9ca3af',
                    padding: '6px 12px',
                    borderRadius: '6px',
                    fontSize: '12px',
                    fontWeight: viewportWidth === p.width ? '700' : '500',
                    border: '1px solid #374151'
                  }}
                >
                  {p.label}
                </button>
              ))}
            </div>

            {/* Range Slider */}
            <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
              <span style={{ fontSize: '11px', color: '#94a3b8' }}>320px</span>
              <input
                type="range"
                min="320"
                max="1200"
                value={viewportWidth}
                onChange={e => setViewportWidth(Number(e.target.value))}
                style={{ flex: 1, accentColor: '#3b82f6' }}
              />
              <span style={{ fontSize: '11px', color: '#94a3b8' }}>1200px</span>
            </div>
          </div>

          {/* Responsive Live Scaler Container */}
          <div style={{ display: 'flex', justifyContent: 'center', backgroundColor: '#090d16', padding: '20px', borderRadius: '12px', border: '1px solid #1e293b', overflowX: 'auto' }}>
            <div style={{
              width: `${viewportWidth}px`,
              transition: 'width 0.2s ease',
              backgroundColor: '#0f172a',
              borderRadius: '8px',
              border: '2px dashed #3b82f6',
              padding: '16px',
              boxShadow: '0 10px 30px rgba(0,0,0,0.5)'
            }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '12px', borderBottom: '1px solid #1e293b', paddingBottom: '8px' }}>
                <span style={{ fontSize: '11px', color: '#60a5fa', fontWeight: '700' }}>LIVE CONTAINER: {viewportWidth}px</span>
                <span style={{ fontSize: '11px', color: '#34d399' }}>Layout: {viewportWidth < 480 ? '1 Column' : viewportWidth < 768 ? '2 Columns' : viewportWidth < 1024 ? '3 Columns' : '4 Columns'}</span>
              </div>

              {/* Dynamic Responsive Grid items */}
              <div style={{
                display: 'grid',
                gridTemplateColumns: viewportWidth < 480 ? '1fr' : viewportWidth < 768 ? 'repeat(2, 1fr)' : viewportWidth < 1024 ? 'repeat(3, 1fr)' : 'repeat(4, 1fr)',
                gap: '12px'
              }}>
                {[
                  { title: 'Redux State', icon: '📦', color: '#3b82f6' },
                  { title: 'CSS Grid', icon: '📐', color: '#8b5cf6' },
                  { title: 'Responsive Hero', icon: '🖼️', color: '#10b981' },
                  { title: 'Mobile Touch', icon: '📱', color: '#f59e0b' }
                ].map((card, i) => (
                  <div key={i} style={{ backgroundColor: '#1e293b', borderRadius: '8px', padding: '12px', border: '1px solid #334155' }}>
                    <div style={{ fontSize: '20px', marginBottom: '6px' }}>{card.icon}</div>
                    <div style={{ fontSize: '13px', fontWeight: '700', color: '#ffffff' }}>{card.title}</div>
                    <div style={{ fontSize: '11px', color: '#94a3b8', marginTop: '4px' }}>
                      Auto-scales without text truncation or edge clipping.
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </section>
      );
    }

    // --- QUESTION 5: ChatGPT Lighthouse Analysis & Implementation ---
    function Question5ChatGptSection() {

      return (
        <section className="glass-card" style={{ padding: '24px' }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: '12px', marginBottom: '16px' }}>
            <div>
              <div style={{ display: 'inline-block', backgroundColor: '#1e3a8a', color: '#93c5fd', fontSize: '11px', fontWeight: '700', padding: '3px 8px', borderRadius: '4px', marginBottom: '6px' }}>
                QUESTION 5
              </div>
              <h2 style={{ fontSize: '20px', fontWeight: '800', color: '#ffffff', margin: 0 }}>
                🤖 ChatGPT AI Lighthouse Analysis & Implemented Code Fix
              </h2>
              <p style={{ fontSize: '13px', color: '#94a3b8', margin: '4px 0 0 0' }}>
                Prompting ChatGPT with the Lighthouse summary and applying the highest-impact suggestion.
              </p>
            </div>
            <button
              onClick={() => setShowFullDiff(!showFullDiff)}
              style={{
                backgroundColor: showFullDiff ? '#3b82f6' : '#1f2937',
                color: '#ffffff',
                padding: '8px 14px',
                borderRadius: '6px',
                fontSize: '12px',
                fontWeight: '600',
                border: '1px solid #374151'
              }}
            >
              {showFullDiff ? 'Collapse Code Diff ▲' : 'View Code Diff ▼'}
            </button>
          </div>

          {/* ChatGPT Prompt & Response Simulation */}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '16px', marginBottom: '20px' }}>
            
            {/* Prompt Card */}
            <div style={{ backgroundColor: '#0f172a', borderRadius: '10px', border: '1px solid #1e293b', padding: '16px' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '10px' }}>
                <span style={{ fontSize: '18px' }}>💬</span>
                <h4 style={{ fontSize: '13px', fontWeight: '700', color: '#60a5fa', margin: 0 }}>
                  Prompt Sent to ChatGPT:
                </h4>
              </div>
              <blockquote style={{ backgroundColor: '#1e293b', padding: '12px', borderRadius: '6px', fontSize: '12px', color: '#cbd5e1', fontStyle: 'italic', borderLeft: '3px solid #3b82f6', lineHeight: 1.5 }}>
                “Suggest improvements for my Lighthouse performance report: LCP is 4.2s, CLS is 0.28, and Google Web Fonts are blocking initial render.”
              </blockquote>
            </div>

            {/* ChatGPT Suggestions Card */}
            <div style={{ backgroundColor: '#0f172a', borderRadius: '10px', border: '1px solid #1e293b', padding: '16px' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '10px' }}>
                <span style={{ fontSize: '18px' }}>🧠</span>
                <h4 style={{ fontSize: '13px', fontWeight: '700', color: '#34d399', margin: 0 }}>
                  ChatGPT Recommended Improvements:
                </h4>
              </div>
              <div style={{ fontSize: '12px', color: '#cbd5e1', lineHeight: 1.5, display: 'flex', flexDirection: 'column', gap: '6px' }}>
                <div>1. <strong>Preconnect Font Origins:</strong> Add <code>rel="preconnect"</code> to Google Fonts origins to shave 300ms DNS handshake.</div>
                <div>2. <strong>Font Display Swap:</strong> Append <code>&display=swap</code> to prevent invisible text flash (FOIT).</div>
                <div>3. <strong>Image Aspect-Ratio:</strong> Add explicit CSS <code>aspect-ratio: 16/9</code> placeholders.</div>
              </div>
            </div>

          </div>

          {/* Implemented Code Diff */}
          {showFullDiff && (
            <div className="animate-fadeIn" style={{ backgroundColor: '#090d16', borderRadius: '8px', padding: '16px', border: '1px solid #1e293b' }}>
              <div style={{ fontSize: '12px', color: '#38bdf8', fontWeight: '700', marginBottom: '8px' }}>
                🔄 Implemented Suggestion: Font Preconnect & Swap Code Diff
              </div>
              <pre style={{ backgroundColor: '#030712', padding: '12px', borderRadius: '6px', fontSize: '12px', overflowX: 'auto', lineHeight: 1.5 }}>
{`// BEFORE (Blocking Render & High LCP):
- <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700" rel="stylesheet">

// AFTER (ChatGPT Recommendation Applied):
+ <link rel="preconnect" href="https://fonts.googleapis.com">
+ <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
+ <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">`}
              </pre>

              <div style={{ marginTop: '12px', display: 'flex', gap: '16px', flexWrap: 'wrap', fontSize: '12px' }}>
                <div style={{ backgroundColor: '#1e293b', padding: '8px 12px', borderRadius: '6px' }}>
                  <span style={{ color: '#94a3b8' }}>LCP Before: </span>
                  <span style={{ color: '#ef4444', fontWeight: '700' }}>4.2s</span> ➔ <span style={{ color: '#10b981', fontWeight: '700' }}>1.1s (74% faster)</span>
                </div>
                <div style={{ backgroundColor: '#1e293b', padding: '8px 12px', borderRadius: '6px' }}>
                  <span style={{ color: '#94a3b8' }}>CLS Before: </span>
                  <span style={{ color: '#ef4444', fontWeight: '700' }}>0.28</span> ➔ <span style={{ color: '#10b981', fontWeight: '700' }}>0.002 (Virtually Zero Shift)</span>
                </div>
              </div>
            </div>
          )}
        </section>
      );
    }

    function ReduxStoreViewer({ state }) {

        <section className="glass-card" style={{ padding: '24px' }}>

            <span style={{ fontSize: '24px' }}>📦</span>
            <div>
              <h3 style={{ fontSize: '18px', fontWeight: '800', color: '#fff', margin: 0 }}>

          </div>

          <pre style={{
            backgroundColor: '#030712',
