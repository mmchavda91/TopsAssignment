    * { box-sizing: border-box; margin: 0; padding: 0; }

    * {
      scrollbar-width: thin;
      scrollbar-color: #3b82f6 #0f172a;

    /* Cross-browser scrollbar for Chrome/WebKit */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 4px; }

      min-height: 100vh;

    code, pre { font-family: 'JetBrains Mono', monospace; }

    @keyframes fadeIn {

      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade { animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

      height: 8px;
      border-radius: 50%;
      background-color: #3b82f6;
      display: inline-block;

            </p>

                🟡 Chrome (Blink Engine)

              <p style={{ fontSize: '12px', color: '#cbd5e1', lineHeight: 1.5, margin: 0 }}>

              </div>
              <p style={{ fontSize: '12px', color: '#cbd5e1', lineHeight: 1.5, margin: 0 }}>
                Completely ignores <code>::-webkit-*</code> scrollbar properties! Requires standard W3C <code>scrollbar-width: thin</code> and <code>scrollbar-color</code> to prevent ugly thick grey bars.
              </p>
            </div>
          </div>

          <div style={{ backgroundColor: '#022c22', border: '1px solid #059669', padding: '12px 16px', borderRadius: '8px' }}>

{`/* Works seamlessly in both Chrome & Firefox */
* {
  scrollbar-width: thin;
  scrollbar-color: #3b82f6 #0f172a; /* Standard Firefox */
}
::-webkit-scrollbar { width: 6px; }  /* Chrome/WebKit */`}

        </div>
      );

{`<img src={coverUrl} alt={title} />

  height="60" 
  loading="lazy" 
  style={{ aspectRatio: "1/1" }} 
/>`}
                </pre>
              </div>
            </div>
          </div>
        </div>
      );
    }
