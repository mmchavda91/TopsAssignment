<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redux Core Concepts — Session 1: Capstone Planning & Architecture</title>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- React 18 & ReactDOM via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel for JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(22, 30, 49, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --cyan: #06b6d4;
      --emerald: #10b981;
      --amber: #f59e0b;
      --rose: #f43f5e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top right, #1e1b4b, #090d16 45%, #050811);
      color: var(--text-main);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    code, pre { font-family: 'JetBrains Mono', monospace; }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0b1120; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    /* Glass Container */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      transition: all 0.25s ease;
    }
    .glass-card:hover {
      border-color: rgba(99, 102, 241, 0.3);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.025em;
    }
    .badge-primary { background: rgba(99, 102, 241, 0.18); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.3); }
    .badge-cyan { background: rgba(6, 182, 212, 0.18); color: #38bdf8; border: 1px solid rgba(6, 182, 212, 0.3); }
    .badge-emerald { background: rgba(16, 185, 129, 0.18); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-amber { background: rgba(245, 158, 11, 0.18); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-rose { background: rgba(244, 63, 94, 0.18); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.3); }

    /* Button styles */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      outline: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #4f46e5, #4338ca);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-secondary:hover {
      background: #334155;
      color: #fff;
    }
    .btn-danger {
      background: rgba(244, 63, 94, 0.2);
      color: #fb7185;
      border: 1px solid rgba(244, 63, 94, 0.3);
    }
    .btn-danger:hover {
      background: rgba(244, 63, 94, 0.35);
      color: #fff;
    }

    /* Tabs */
    .nav-tab {
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s;
      background: transparent;
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .nav-tab:hover {
      color: #f8fafc;
      background: rgba(255, 255, 255, 0.05);
    }
    .nav-tab.active {
      color: #ffffff;
      background: rgba(99, 102, 241, 0.2);
      border-color: rgba(99, 102, 241, 0.5);
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.25);
    }

    /* Modal Backdrop */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Keyframes */
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.96); }
    }
    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 2s infinite ease-in-out;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ============================================================================
    // HEADER COMPONENT (With Real Interactive Login / Logout)
    // ============================================================================
    function Header({ activeTab, setActiveTab, currentUser, onOpenLogin, onLogout }) {
      const tabs = [
        { id: 'q1', label: 'Q1: Daily App Scope', icon: '🌐' },
        { id: 'q2', label: 'Q2: E-Com Dashboard', icon: '📊' },
        { id: 'q3', label: 'Q3: AI Resume Builder', icon: '🤖' },
        { id: 'q4', label: 'Q4: Flow Diagram', icon: '🔄' },
        { id: 'q5', label: 'Q5: Capstone Choice', icon: '🏆' },
        { id: 'api', label: '⚡ Live API & Auth Demo', icon: '🚀' },
      ];

      return (
        <header style={{ borderBottom: '1px solid rgba(255,255,255,0.08)', background: 'rgba(9, 13, 22, 0.88)', backdropFilter: 'blur(16px)', position: 'sticky', top: 0, zIndex: 50 }}>
          <div style={{ maxWidth: '1280px', margin: '0 auto', padding: '16px 24px', display: 'flex', flexWrap: 'wrap', alignItems: 'center', justifyContent: 'space-between', gap: '16px' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '14px' }}>
              <div style={{ width: '42px', height: '42px', borderRadius: '12px', background: 'linear-gradient(135deg, #6366f1, #06b6d4)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '22px', boxShadow: '0 4px 12px rgba(99,102,241,0.4)' }}>
                ⚛️
              </div>
              <div>
                <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                  <h1 style={{ fontSize: '1.15rem', fontWeight: 800, letterSpacing: '-0.02em', color: '#f8fafc' }}>
                    Redux Core Concepts
                  </h1>
                  <span className="badge badge-primary">Session 1</span>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '6px', marginLeft: '6px' }}>
                    <div className="live-dot"></div>
                    <span style={{ fontSize: '0.75rem', color: '#10b981', fontWeight: 600 }}>Port 3001 Active</span>
                  </div>
                </div>
                <p style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>
                  Interactive Capstone Architecture &amp; Assignment Solutions
                </p>
              </div>
            </div>

            {/* Auth Button in Header */}
            <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
              {currentUser ? (
                <div style={{ display: 'flex', alignItems: 'center', gap: '10px', background: 'rgba(15, 23, 42, 0.8)', padding: '6px 12px', borderRadius: '12px', border: '1px solid rgba(16, 185, 129, 0.3)' }}>
                  <div style={{ width: '30px', height: '30px', borderRadius: '50%', background: 'linear-gradient(135deg, #10b981, #059669)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '14px', fontWeight: 'bold' }}>
                    {currentUser.name.charAt(0)}
                  </div>
                  <div>
                    <div style={{ fontSize: '0.82rem', fontWeight: 700, color: '#f8fafc' }}>{currentUser.name}</div>
                    <div style={{ fontSize: '0.68rem', color: '#34d399' }}>● {currentUser.role}</div>
                  </div>
                  <button className="btn btn-danger" style={{ padding: '4px 10px', fontSize: '0.75rem', marginLeft: '4px' }} onClick={onLogout}>
                    🔒 Logout
                  </button>
                </div>
              ) : (
                <button className="btn btn-primary" onClick={onOpenLogin}>
                  🔐 Login / Sign In
                </button>
              )}
            </div>
          </div>

          {/* Navigation Tabs */}
          <div style={{ maxWidth: '1280px', margin: '0 auto', padding: '0 24px 12px', display: 'flex', gap: '6px', overflowX: 'auto' }}>
            {tabs.map(tab => (
              <button
                key={tab.id}
                className={`nav-tab ${activeTab === tab.id ? 'active' : ''}`}
                onClick={() => setActiveTab(tab.id)}
              >
                <span>{tab.icon}</span>
                <span>{tab.label}</span>
              </button>
            ))}
          </div>
        </header>
      );
    }

    // ============================================================================
    // LOGIN MODAL COMPONENT
    // ============================================================================
    function LoginModal({ isOpen, onClose, onLoginSuccess }) {
      const [email, setEmail] = useState('seller@flipkart-hub.com');
      const [password, setPassword] = useState('password123');
      const [role, setRole] = useState('E-Commerce Seller');

      if (!isOpen) return null;

      const handleSubmit = (e) => {
        e.preventDefault();
        onLoginSuccess({
          name: email.split('@')[0],
          email: email,
          role: role,
          token: "jwt_mock_token_" + Math.random().toString(36).substring(2),
          loginAt: new Date().toLocaleTimeString()
        });
        onClose();
      };

      const handleQuickDemo = (userRole) => {
        const demoUser = userRole === 'seller' ? {
          name: "Mamta (Seller Admin)",
          email: "mamta.seller@ecommerce.com",
          role: "Verified Seller Pro",
          token: "jwt_demo_seller_987654321",
          loginAt: new Date().toLocaleTimeString()
        } : {
          name: "Mamta (Job Seeker)",
          email: "mamta.dev@reactcareer.com",
          role: "Candidate / Developer",
          token: "jwt_demo_resume_123456789",
          loginAt: new Date().toLocaleTimeString()
        };
        onLoginSuccess(demoUser);
        onClose();
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="glass-card" style={{ maxWidth: '440px', width: '100%', padding: '28px', background: '#0f172a', border: '1px solid rgba(99, 102, 241, 0.4)', boxShadow: '0 20px 50px rgba(0,0,0,0.8)' }} onClick={e => e.stopPropagation()}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '18px' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                <span style={{ fontSize: '24px' }}>🔐</span>
                <h3 style={{ fontSize: '1.25rem', fontWeight: 800, color: '#f8fafc' }}>User Authentication</h3>
              </div>
              <button onClick={onClose} style={{ background: 'transparent', border: 'none', color: '#94a3b8', fontSize: '20px', cursor: 'pointer' }}>✕</button>
            </div>

            <p style={{ fontSize: '0.84rem', color: 'var(--text-muted)', marginBottom: '16px' }}>
              Simulates Redux <code style={{ color: '#818cf8' }}>authSlice.actions.loginSuccess()</code> and saves session token:
            </p>

            <form onSubmit={handleSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '14px' }}>
              <div>
                <label style={{ fontSize: '0.78rem', color: '#cbd5e1', fontWeight: 600, display: 'block', marginBottom: '6px' }}>Email Address</label>
                <input
                  type="email"
                  value={email}
                  onChange={e => setEmail(e.target.value)}
                  style={{ width: '100%', padding: '10px 14px', borderRadius: '10px', background: 'rgba(2, 6, 23, 0.8)', border: '1px solid rgba(255,255,255,0.1)', color: '#fff', fontSize: '0.85rem', outline: 'none' }}
                  required
                />
              </div>

              <div>
                <label style={{ fontSize: '0.78rem', color: '#cbd5e1', fontWeight: 600, display: 'block', marginBottom: '6px' }}>Password</label>
                <input
                  type="password"
                  value={password}
                  onChange={e => setPassword(e.target.value)}
                  style={{ width: '100%', padding: '10px 14px', borderRadius: '10px', background: 'rgba(2, 6, 23, 0.8)', border: '1px solid rgba(255,255,255,0.1)', color: '#fff', fontSize: '0.85rem', outline: 'none' }}
                  required
                />
              </div>

              <div>
                <label style={{ fontSize: '0.78rem', color: '#cbd5e1', fontWeight: 600, display: 'block', marginBottom: '6px' }}>Role</label>
                <select
                  value={role}
                  onChange={e => setRole(e.target.value)}
                  style={{ width: '100%', padding: '10px 14px', borderRadius: '10px', background: 'rgba(2, 6, 23, 0.8)', border: '1px solid rgba(255,255,255,0.1)', color: '#fff', fontSize: '0.85rem', outline: 'none' }}
                >
                  <option value="E-Commerce Seller">E-Commerce Seller (Flipkart Panel)</option>
                  <option value="Candidate">AI Resume Candidate</option>
                  <option value="Music Curator">Music Curator (SoundPulse)</option>
                </select>
              </div>

              <button type="submit" className="btn btn-primary" style={{ width: '100%', padding: '12px', marginTop: '6px' }}>
                🚀 Log In &amp; Update Redux State
              </button>
            </form>

            <div style={{ marginTop: '20px', paddingTop: '16px', borderTop: '1px solid rgba(255,255,255,0.08)' }}>
              <div style={{ fontSize: '0.75rem', color: '#94a3b8', textAlign: 'center', marginBottom: '10px' }}>Or 1-Click Instant Demo Login:</div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' }}>
                <button className="btn btn-secondary" style={{ fontSize: '0.75rem', padding: '8px' }} onClick={() => handleQuickDemo('seller')}>
                  ⚡ As Seller Admin
                </button>
                <button className="btn btn-secondary" style={{ fontSize: '0.75rem', padding: '8px' }} onClick={() => handleQuickDemo('candidate')}>
                  ⚡ As Candidate
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================================
    // TAB: LIVE API & AUTH DEMO (How to check API & Login/Logout)
    // ============================================================================
    function LiveApiAndAuthDemo({ currentUser, onOpenLogin, onLogout }) {
      const [apiEndpoint, setApiEndpoint] = useState('products');
      const [apiData, setApiData] = useState(null);
      const [isLoading, setIsLoading] = useState(false);
      const [httpStatus, setHttpStatus] = useState(null);
      const [errorMsg, setErrorMsg] = useState(null);

      const fetchLiveApi = async (endpoint) => {
        setIsLoading(true);
        setErrorMsg(null);
        setHttpStatus('Pending...');
        
        const urlMap = {
          dbjson: '/db.json',
          products: 'https://dummyjson.com/products?limit=3',
          users: 'https://dummyjson.com/users?limit=3',
          quotes: 'https://dummyjson.com/quotes?limit=3'
        };

        const targetUrl = urlMap[endpoint];

        try {
          console.log(`[API Request Started] Fetching: ${targetUrl}`);
          const res = await fetch(targetUrl);
          setHttpStatus(`${res.status} ${res.statusText}`);
          const json = await res.json();
          console.log(`[API Response Received]:`, json);
          setApiData(json);
        } catch (err) {
          console.error(`[API Fetch Error]:`, err);
          setErrorMsg(err.message);
          setHttpStatus('500 Network Error');
        } finally {
          setIsLoading(false);
        }
      };

      useEffect(() => {
        fetchLiveApi(apiEndpoint);
      }, [apiEndpoint]);

      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: '24px' }}>
          {/* Header Card */}
          <div className="glass-card" style={{ padding: '24px' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: 'wrap', gap: '12px', marginBottom: '12px' }}>
              <div>
                <span className="badge badge-emerald" style={{ marginBottom: '8px' }}>PRACTICAL GUIDE</span>
                <h2 style={{ fontSize: '1.4rem', fontWeight: 700 }}>Login, Logout &amp; Live API Data Verification</h2>
              </div>
              <span className="badge badge-cyan">Redux State + Network DevTools</span>
            </div>
            <p style={{ color: 'var(--text-muted)', fontSize: '0.92rem' }}>
              આ સેક્શનમાં જુઓ કે React અને Redux માં <strong>Login / Logout</strong> સ્ટેટ કેવી રીતે કામ કરે છે, અને <strong>API કોલ કરીને બ્રાઉઝરમાં ડેટા કેવી રીતે ચેક થાય છે</strong>.
            </p>
          </div>

          {/* PART 1: AUTHENTICATION STATE */}
          <div className="glass-card" style={{ padding: '24px' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px', flexWrap: 'wrap', gap: '10px' }}>
              <div>
                <h3 style={{ fontSize: '1.15rem', fontWeight: 700, color: '#818cf8', display: 'flex', alignItems: 'center', gap: '8px' }}>
                  🔐 Part 1: Login &amp; Logout State (Redux authSlice)
                </h3>
                <p style={{ fontSize: '0.82rem', color: 'var(--text-muted)' }}>
                  કેવી રીતે યુઝર ઓથેન્ટિકેટ થાય છે અને લોગઆઉટ કરવાથી સ્ટેટ ખાલી થાય છે:
                </p>
              </div>
              {currentUser ? (
                <button className="btn btn-danger" onClick={onLogout}>🔒 Click to Logout</button>
              ) : (
                <button className="btn btn-primary" onClick={onOpenLogin}>🔐 Click to Login</button>
              )}
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '16px' }}>
              {/* Visual Card */}
              <div style={{ background: 'rgba(15, 23, 42, 0.7)', padding: '18px', borderRadius: '12px', border: '1px solid rgba(255,255,255,0.08)' }}>
                <div style={{ fontSize: '0.78rem', color: '#94a3b8', marginBottom: '8px' }}>વર્તમાન યુઝર સ્ટેટસ:</div>
                {currentUser ? (
                  <div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '12px' }}>
                      <div style={{ width: '40px', height: '40px', borderRadius: '50%', background: '#10b981', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '18px', fontWeight: 'bold' }}>
                        {currentUser.name.charAt(0)}
                      </div>
                      <div>
                        <div style={{ fontWeight: 700, color: '#f8fafc' }}>{currentUser.name}</div>
                        <div style={{ fontSize: '0.78rem', color: '#94a3b8' }}>{currentUser.email}</div>
                      </div>
                    </div>
                    <span className="badge badge-emerald">Status: Authenticated (Logged In)</span>
                    <div style={{ marginTop: '10px', fontSize: '0.75rem', color: '#cbd5e1' }}>
                      <strong>Login Time:</strong> {currentUser.loginAt}
                    </div>
                  </div>
                ) : (
                  <div style={{ textAlign: 'center', padding: '20px 0' }}>
                    <div style={{ fontSize: '32px', marginBottom: '8px' }}>👤</div>
                    <span className="badge badge-rose">Status: Guest / Logged Out</span>
                    <p style={{ fontSize: '0.8rem', color: '#64748b', marginTop: '8px' }}>
                      કોઈ યુઝર લોગિન નથી. ઉપરના <strong>"Click to Login"</strong> બટન પર ક્લિક કરો.
                    </p>
                  </div>
                )}
              </div>

              {/* Redux State Object Preview */}
              <div style={{ background: '#020617', padding: '16px', borderRadius: '12px', border: '1px solid rgba(255,255,255,0.06)' }}>
                <div style={{ fontSize: '0.75rem', color: '#38bdf8', fontFamily: 'JetBrains Mono', marginBottom: '6px' }}>
                  // Redux Store: state.auth
                </div>
                <pre style={{ fontSize: '0.75rem', color: '#a5b4fc', lineHeight: 1.5, overflowX: 'auto' }}>
{JSON.stringify({
  isAuthenticated: !!currentUser,
  user: currentUser ? {
    name: currentUser.name,
    email: currentUser.email,
    role: currentUser.role
  } : null,
  token: currentUser ? currentUser.token : null,
  status: currentUser ? 'succeeded' : 'idle'
}, null, 2)}
                </pre>
              </div>
            </div>
          </div>

          {/* PART 2: LIVE API DATA FETCHER */}
          <div className="glass-card" style={{ padding: '24px' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px', flexWrap: 'wrap', gap: '10px' }}>
              <div>
                <h3 style={{ fontSize: '1.15rem', fontWeight: 700, color: '#06b6d4', display: 'flex', alignItems: 'center', gap: '8px' }}>
                  🌐 Part 2: Real API Live Fetcher &amp; Verification
                </h3>
                <p style={{ fontSize: '0.82rem', color: 'var(--text-muted)' }}>
                  નીચેના બટન પર ક્લિક કરીને લાઈવ API કોલ કરો અને રિસ્પોન્સ ચેક કરો:
                </p>
              </div>

              <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
                <select

    // ============================================================================
    // MAIN APP COMPONENT
    // ============================================================================
    function App() {
      const [activeTab, setActiveTab] = useState('q1');
      const [isLoginOpen, setIsLoginOpen] = useState(false);
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem('soundpulse_user');
          return saved ? JSON.parse(saved) : null;
        } catch (e) {
          return null;
        }
      });

      const handleLoginSuccess = (user) => {
        setCurrentUser(user);
        try {
          localStorage.setItem('soundpulse_user', JSON.stringify(user));
        } catch (e) {}
      };

      const handleLogout = () => {
        setCurrentUser(null);
        try {
          localStorage.removeItem('soundpulse_user');
        } catch (e) {}
      };

      return (
        <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
          <Header
            activeTab={activeTab}
            setActiveTab={setActiveTab}
            currentUser={currentUser}
            onOpenLogin={() => setIsLoginOpen(true)}
            onLogout={handleLogout}
          />
          
          <main style={{ maxWidth: '1280px', margin: '0 auto', padding: '32px 24px', flex: 1, width: '100%' }}>
            {activeTab === 'q1' && <QuestionOneScope />}
            {activeTab === 'q2' && <QuestionTwoDashboard />}
            {activeTab === 'q3' && <QuestionThreeAI />}
            {activeTab === 'q4' && <QuestionFourFlow />}
            {activeTab === 'q5' && <QuestionFiveChoice />}
            {activeTab === 'api' && (
              <LiveApiAndAuthDemo
                currentUser={currentUser}
                onOpenLogin={() => setIsLoginOpen(true)}
                onLogout={handleLogout}
              />
            )}
          </main>

          <LoginModal
            isOpen={isLoginOpen}
            onClose={() => setIsLoginOpen(false)}
            onLoginSuccess={handleLoginSuccess}
          />

          <footer style={{ borderTop: '1px solid rgba(255,255,255,0.06)', padding: '20px 24px', textAlign: 'center', color: '#64748b', fontSize: '0.8rem', background: 'rgba(9, 13, 22, 0.95)' }}>
            TOPS Technology — Redux Core Concepts Capstone Assignment • Running on Node HTTP Server (Port 3001)
          </footer>
        </div>
      );
    }
