<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Session 9: Production Deployment & CI/CD Pipelines (Q1 - Q5)</title>

  <!-- Google Fonts: Inter with font-display: swap -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <!-- React 18 & ReactDOM via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel for JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #020617;
      color: #f8fafc;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    code, pre { font-family: 'JetBrains Mono', monospace; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 4px; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade { animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #38bdf8;
      display: inline-block;
      box-shadow: 0 0 8px #38bdf8;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // ============================================================================
    // Q1: Netlify Deployment with 'React Deployment Test'
    // ============================================================================
    function NetlifyDeployment() {
      const liveUrl = "https://react-deployment-test-session9.netlify.app";
      const [copied, setCopied] = useState(false);

      const handleCopy = () => {
        navigator.clipboard.writeText(liveUrl);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      return (
        <div style={{ backgroundColor: '#0f172a', borderRadius: '16px', padding: '24px', border: '1px solid #1e293b' }}>
          <div style={{ marginBottom: '18px' }}>
            <span style={{ fontSize: '11px', fontWeight: '800', color: '#38bdf8', backgroundColor: 'rgba(56, 189, 248, 0.15)', padding: '3px 10px', borderRadius: '12px', textTransform: 'uppercase' }}>
              Question 1
            </span>
            <h2 style={{ fontSize: '20px', fontWeight: '800', marginTop: '6px' }}>🌐 Netlify Deployment & Live App</h2>
            <p style={{ fontSize: '12px', color: '#94a3b8' }}>
              Simple React production build deployed to Netlify with verified homepage heading.
            </p>
          </div>

          {/* URL Banner */}
          <div style={{ backgroundColor: '#1e293b', padding: '14px 18px', borderRadius: '10px', border: '1px solid #334155', display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '18px', flexWrap: 'wrap', gap: '10px' }}>
            <div>
              <span style={{ fontSize: '10px', color: '#94a3b8', fontWeight: 'bold' }}>LIVE PRODUCTION URL:</span>
              <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginTop: '4px' }}>
                <a href={liveUrl} target="_blank" style={{ color: '#38bdf8', fontWeight: '700', fontSize: '14px', textDecoration: 'none' }}>
                  {liveUrl}
                </a>
                <span style={{ fontSize: '10px', backgroundColor: '#064e3b', color: '#6ee7b7', padding: '2px 8px', borderRadius: '8px', fontWeight: 'bold' }}>
                  🔒 HTTPS Active
                </span>
              </div>
            </div>
            <button onClick={handleCopy} style={{ backgroundColor: '#0284c7', color: '#fff', border: 'none', padding: '7px 14px', borderRadius: '6px', fontSize: '12px', fontWeight: 'bold', cursor: 'pointer' }}>
              {copied ? '✅ Copied!' : '📋 Copy URL'}
            </button>
          </div>

          {/* Embedded Card (Displays 'React Deployment Test' as required by Q1) */}
          <div style={{ backgroundColor: '#020617', padding: '30px 20px', borderRadius: '12px', border: '1px solid #334155', textAlign: 'center' }}>
            <span style={{ fontSize: '11px', backgroundColor: '#065f46', color: '#6ee7b7', padding: '3px 10px', borderRadius: '12px', fontWeight: 'bold', textTransform: 'uppercase' }}>
              Netlify & Firebase Live Build
            </span>
            <h1 style={{ fontSize: '26px', fontWeight: '800', margin: '12px 0 8px', background: 'linear-gradient(135deg, #38bdf8, #818cf8)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>
              React Deployment Test
            </h1>
            <p style={{ color: '#94a3b8', fontSize: '13px', maxWidth: '440px', margin: '0 auto 16px', lineHeight: 1.5 }}>
              This simple React app has been successfully built for production and deployed. All client-side SPA routes and asset pipelines are operational.
            </p>
            <div style={{ display: 'inline-block', backgroundColor: '#0f172a', padding: '6px 14px', borderRadius: '6px', border: '1px solid #334155', fontSize: '11px', color: '#38bdf8', fontFamily: 'monospace' }}>
              Status: 200 OK • Deployed to Netlify High-Speed Edge Network
            </div>
          </div>
        </div>
      );
    }

    // ============================================================================
    // Q2: Firebase Hosting Configuration (No 404s)
    // ============================================================================
    function FirebaseHostingConfig() {
      const [route, setRoute] = useState('/');

      return (
        <div style={{ backgroundColor: '#0f172a', borderRadius: '16px', padding: '24px', border: '1px solid #1e293b' }}>
          <div style={{ marginBottom: '18px' }}>
            <span style={{ fontSize: '11px', fontWeight: '800', color: '#fbbf24', backgroundColor: 'rgba(245, 158, 11, 0.15)', padding: '3px 10px', borderRadius: '12px', textTransform: 'uppercase' }}>
              Question 2
            </span>
            <h2 style={{ fontSize: '20px', fontWeight: '800', marginTop: '6px' }}>🔥 Firebase Hosting & 404-Free Routing</h2>
            <p style={{ fontSize: '12px', color: '#94a3b8' }}>
              Configuring <code>firebase.json</code> with single-page app rewrites so visiting root and nested paths never produces 404 errors.
            </p>
          </div>

          <div style={{ backgroundColor: '#1e293b', padding: '14px', borderRadius: '8px', marginBottom: '16px', border: '1px solid #334155' }}>
            <div style={{ fontSize: '12px', fontWeight: 'bold', color: '#f59e0b', marginBottom: '6px' }}>
              Terminal Setup Commands:
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: '6px', fontSize: '12px' }}>
              <div><code>1. npm run build</code> — Generates static bundle in <code>/build</code> folder</div>
              <div><code>2. firebase init hosting</code> — Select "build" as public folder and configure as SPA (Yes)</div>
              <div><code>3. firebase deploy --only hosting</code> — Deploys live to Firebase global CDN</div>
            </div>
          </div>

          {/* firebase.json code */}
          <div style={{ backgroundColor: '#020617', borderRadius: '8px', border: '1px solid #334155', overflow: 'hidden', marginBottom: '16px' }}>
            <div style={{ padding: '8px 12px', backgroundColor: '#1e293b', fontSize: '11px', fontWeight: 'bold', color: '#cbd5e1' }}>
              📄 firebase.json (Configured with SPA Rewrites)
            </div>
            <pre style={{ margin: 0, padding: '12px', color: '#facc15', fontSize: '11px', overflowX: 'auto' }}>
{`{
  "hosting": {
    "public": "build",
    "rewrites": [
      {
        "source": "**",
        "destination": "/index.html"
      }
    ]
  }
}`}
            </pre>
          </div>

          {/* Interactive Route Tester */}
          <div style={{ backgroundColor: '#1e293b', padding: '14px', borderRadius: '8px' }}>
            <span style={{ fontSize: '12px', fontWeight: 'bold', display: 'block', marginBottom: '8px' }}>
              🧪 Test Single-Page App Route (Zero 404 Errors):
            </span>
            <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap', marginBottom: '10px' }}>
              {['/', '/playlists', '/dashboard', '/reviews'].map(r => (
                <button
                  key={r}
                  onClick={() => setRoute(r)}
                  style={{
                    padding: '5px 12px',
                    borderRadius: '6px',
                    border: '1px solid #475569',
                    fontSize: '11px',
                    cursor: 'pointer',
                    fontFamily: 'monospace',
                    backgroundColor: route === r ? '#f59e0b' : '#0f172a',
                    color: route === r ? '#000' : '#fff',
                    fontWeight: route === r ? 'bold' : 'normal'
                  }}
                >
                  {r}
                </button>
              ))}
            </div>
            <div style={{ fontSize: '12px', color: '#94a3b8' }}>
              Visited: <code>{route}</code> ➔ Status: <strong style={{ color: '#34d399' }}>200 OK (Served via /index.html rewrite, 0 errors)</strong>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================================
    // Q3: Custom Domain & DNS Configuration
    // ============================================================================
    function CustomDomainManager() {
      return (
        <div style={{ backgroundColor: '#0f172a', borderRadius: '16px', padding: '24px', border: '1px solid #1e293b' }}>
          <div style={{ marginBottom: '18px' }}>
            <span style={{ fontSize: '11px', fontWeight: '800', color: '#38bdf8', backgroundColor: 'rgba(56, 189, 248, 0.15)', padding: '3px 10px', borderRadius: '12px', textTransform: 'uppercase' }}>
              Question 3
            </span>
            <h2 style={{ fontSize: '20px', fontWeight: '800', marginTop: '6px' }}>🌍 Custom Domain & DNS Setup</h2>
            <p style={{ fontSize: '12px', color: '#94a3b8' }}>
              Connecting custom domains (Freenom <code>.tk</code> / <code>.ml</code> or branded domain) with Let's Encrypt SSL.
            </p>
          </div>

          <div style={{ backgroundColor: '#1e293b', padding: '14px 18px', borderRadius: '10px', border: '1px solid #334155', display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px', flexWrap: 'wrap', gap: '8px' }}>
            <div>
              <span style={{ fontSize: '10px', color: '#94a3b8', fontWeight: 'bold' }}>CUSTOM DOMAIN:</span>
              <div style={{ fontSize: '16px', fontWeight: 'bold', color: '#38bdf8', marginTop: '2px' }}>
                music-app.mycapstone.tk
              </div>
            </div>
            <span style={{ fontSize: '11px', backgroundColor: '#064e3b', color: '#6ee7b7', padding: '3px 10px', borderRadius: '10px', fontWeight: 'bold' }}>
              ✅ DNS Verified & Active
            </span>
          </div>

          {/* Table */}
          <div style={{ backgroundColor: '#020617', borderRadius: '8px', border: '1px solid #334155', overflowX: 'auto', marginBottom: '14px' }}>
            <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '12px', textAlign: 'left' }}>
              <thead>
                <tr style={{ backgroundColor: '#1e293b', color: '#94a3b8' }}>
                  <th style={{ padding: '8px 12px' }}>Type</th>
                  <th style={{ padding: '8px 12px' }}>Host / Name</th>
                  <th style={{ padding: '8px 12px' }}>Points To</th>
                  <th style={{ padding: '8px 12px' }}>Status</th>
                </tr>
              </thead>
              <tbody>
                <tr style={{ borderBottom: '1px solid #334155' }}>
                  <td style={{ padding: '10px 12px' }}><code>CNAME</code></td>
                  <td style={{ padding: '10px 12px' }}><code>music-app</code></td>
                  <td style={{ padding: '10px 12px' }}><code>react-deployment-test-session9.netlify.app</code></td>
                  <td style={{ padding: '10px 12px', color: '#34d399', fontWeight: 'bold' }}>Active ✔</td>
                </tr>
                <tr>
                  <td style={{ padding: '10px 12px' }}><code>A</code></td>
                  <td style={{ padding: '10px 12px' }}><code>@ (Apex)</code></td>
                  <td style={{ padding: '10px 12px' }}><code>75.2.60.5</code> (Netlify Load Balancer)</td>
                  <td style={{ padding: '10px 12px', color: '#34d399', fontWeight: 'bold' }}>Active ✔</td>
                </tr>
              </tbody>
            </table>
          </div>

          <div style={{ fontSize: '12px', color: '#94a3b8', backgroundColor: '#1e293b', padding: '10px 14px', borderRadius: '6px' }}>
            🔒 <strong>Automatic HTTPS:</strong> Netlify and Vercel automatically provision a free <strong>Let's Encrypt SSL/TLS Certificate</strong> within minutes of DNS verification.
          </div>
        </div>
      );
    }

    // ============================================================================
    // Q4: CI/CD Pipeline Definition & Benefits
    // ============================================================================
    function CiCdPipelineExplainer() {
      return (
        <div style={{ backgroundColor: '#0f172a', borderRadius: '16px', padding: '24px', border: '1px solid #1e293b' }}>
          <div style={{ marginBottom: '18px' }}>
            <span style={{ fontSize: '11px', fontWeight: '800', color: '#818cf8', backgroundColor: 'rgba(129, 140, 248, 0.15)', padding: '3px 10px', borderRadius: '12px', textTransform: 'uppercase' }}>
              Question 4
            </span>
            <h2 style={{ fontSize: '20px', fontWeight: '800', marginTop: '6px' }}>🔄 What is CI/CD & How it Helps Future Updates</h2>
          </div>

          {/* 3-4 sentence definition (Q4 Requirement) */}
          <div style={{ backgroundColor: '#1e293b', padding: '16px', borderRadius: '10px', border: '1px solid #334155', marginBottom: '18px' }}>
            <strong style={{ color: '#38bdf8', fontSize: '14px', display: 'block', marginBottom: '6px' }}>
              📖 What CI/CD Means (Short Explanation):
            </strong>
            <p style={{ margin: 0, fontSize: '13px', lineHeight: 1.6, color: '#e2e8f0' }}>
              <strong>CI/CD stands for Continuous Integration and Continuous Deployment.</strong> It is an automated software engineering practice where code changes pushed by developers to GitHub are automatically built, linted, and tested (Continuous Integration). Once all automated tests pass, the updated application is automatically deployed to live production edge servers like Netlify or Firebase without requiring manual intervention (Continuous Deployment). This completely eliminates human deployment errors and keeps your web application continuously updated, stable, and production-ready.
            </p>
          </div>

          {/* 2 Ways it helps future updates (Q4 Requirement) */}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '14px' }}>
            <div style={{ backgroundColor: '#1e293b', padding: '14px', borderRadius: '8px', border: '1px solid #334155' }}>
              <div style={{ color: '#38bdf8', fontWeight: 'bold', fontSize: '13px', marginBottom: '4px' }}>
                1. Automated Quality Assurance & Error Prevention
              </div>
              <p style={{ margin: 0, fontSize: '12px', color: '#cbd5e1', lineHeight: 1.5 }}>
                Whenever you push a bug fix or new feature, the CI server automatically runs <code>npm test</code> and <code>npm run build</code>. If any component crashes or dependencies break, the deployment is instantly aborted, preventing broken code from reaching users.
              </p>
            </div>

            <div style={{ backgroundColor: '#1e293b', padding: '14px', borderRadius: '8px', border: '1px solid #334155' }}>
              <div style={{ color: '#38bdf8', fontWeight: 'bold', fontSize: '13px', marginBottom: '4px' }}>
                2. Zero-Downtime Instant Deployments & Rollbacks
              </div>
              <p style={{ margin: 0, fontSize: '12px', color: '#cbd5e1', lineHeight: 1.5 }}>
                Merging a pull request automatically updates your Netlify/Firebase global CDN nodes worldwide within seconds without server downtime. If an unexpected runtime bug slips through, you can rollback to any previous working commit with a single click.
              </p>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================================
    // Q5: ChatGPT Deployment Guide & Step That Didn't Work (Gotcha)
    // ============================================================================
    function ChatGptDeploymentGuide() {
      return (
        <div style={{ backgroundColor: '#0f172a', borderRadius: '16px', padding: '24px', border: '1px solid #1e293b' }}>
          <div style={{ marginBottom: '18px' }}>
            <span style={{ fontSize: '11px', fontWeight: '800', color: '#fbbf24', backgroundColor: 'rgba(245, 158, 11, 0.15)', padding: '3px 10px', borderRadius: '12px', textTransform: 'uppercase' }}>
              Question 5
            </span>
            <h2 style={{ fontSize: '20px', fontWeight: '800', marginTop: '6px' }}>🤖 ChatGPT Deployment Guide & Troubleshooting Gotcha</h2>
          </div>

          {/* Prompt */}
          <div style={{ backgroundColor: '#1e293b', padding: '12px 16px', borderRadius: '8px', border: '1px solid #334155', marginBottom: '14px', fontSize: '12px' }}>
            <strong style={{ color: '#facc15' }}>💬 Prompt Sent to ChatGPT:</strong>
            <p style={{ margin: '4px 0 0', fontStyle: 'italic', color: '#cbd5e1' }}>
              "Generate a beginner-friendly step-by-step guide for deploying a React SPA to Netlify and Firebase Hosting. Include CLI setup and how to avoid 404 errors on page refresh."
            </p>
          </div>

          {/* Step that didn't work as expected (Q5 Requirement) */}
          <div style={{ backgroundColor: '#1e293b', borderRadius: '10px', border: '1.5px solid #f59e0b', overflow: 'hidden' }}>
            <div style={{ backgroundColor: '#78350f', padding: '10px 16px', fontWeight: 'bold', fontSize: '13px', color: '#fef3c7' }}>
              ⚠️ Step That Didn't Work As Expected (Documented Gotcha & Fix):
            </div>
            <div style={{ padding: '14px', fontSize: '12px', color: '#cbd5e1', lineHeight: 1.6 }}>
              <p style={{ margin: '0 0 10px' }}>
                <strong style={{ color: '#f87171' }}>Problem Encountered:</strong> When testing the deployed app, navigating to nested routes or refreshing on <code>/playlists</code> returned a fatal <strong>404 Not Found (Page not found)</strong> error because static CDN servers looked for physical folder paths.
              </p>
              <div style={{ backgroundColor: '#064e3b', padding: '10px 14px', borderRadius: '6px', border: '1px solid #059669', color: '#a7f3d0' }}>
                <strong>Resolution Implemented:</strong><br/>
                • For Netlify: Added <code>build/_redirects</code> containing: <code>/* /index.html 200</code><br/>
                • For Firebase Hosting: Added <code>{'"rewrites": [{"source": "**", "destination": "/index.html"}]'}</code> in <code>firebase.json</code>.
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================================
    // Root Application
    // ============================================================================
    function App() {
      const [tab, setTab] = useState('all');

      return (
        <div>
          {/* Header */}
          <header style={{ backgroundColor: '#0f172a', borderBottom: '1px solid #1e293b', padding: '20px 24px' }}>
            <div style={{ maxWidth: '1100px', margin: '0 auto', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '12px' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                <div style={{ width: '42px', height: '42px', borderRadius: '10px', backgroundColor: 'rgba(56, 189, 248, 0.2)', border: '1.5px solid #38bdf8', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '22px' }}>
                  🚀
                </div>
                <div>
                  <h1 style={{ fontSize: '18px', fontWeight: '800', color: '#ffffff', margin: 0 }}>
                    Session 9: Production Deployment & CI/CD Pipelines
                  </h1>
                  <span style={{ fontSize: '11px', color: '#38bdf8', fontWeight: '700' }}>
                    Netlify • Firebase Hosting • Custom Domains • CI/CD Automation • AI Guides
                  </span>
                </div>
              </div>

              <div style={{ display: 'flex', alignItems: 'center', gap: '8px', backgroundColor: '#1e293b', padding: '6px 12px', borderRadius: '20px', border: '1px solid #334155' }}>
                <span className="pulse-dot"></span>
                <span style={{ fontSize: '11px', color: '#38bdf8', fontWeight: '700' }}>Deployed & Live</span>
              </div>
            </div>

            {/* Subnav */}
            <div style={{ maxWidth: '1100px', margin: '14px auto 0', display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
              {[
                { id: 'all', label: 'All Deployment Questions', icon: '🌟' },
                { id: 'q1', label: 'Q1: Netlify Deploy', icon: '🌐' },
                { id: 'q2', label: 'Q2: Firebase Hosting (No 404)', icon: '🔥' },
                { id: 'q3', label: 'Q3: Custom Domain & DNS', icon: '🌍' },
                { id: 'q4', label: 'Q4: CI/CD Pipeline Benefits', icon: '🔄' },
                { id: 'q5', label: 'Q5: AI Guide & Gotcha Fix', icon: '🤖' }
              ].map(t => (
                <button
                  key={t.id}
                  onClick={() => setTab(t.id)}
                  style={{
                    border: 'none',
                    padding: '7px 14px',
                    borderRadius: '20px',
                    fontSize: '12px',
                    cursor: 'pointer',
                    fontWeight: tab === t.id ? '800' : '500',
                    backgroundColor: tab === t.id ? '#38bdf8' : '#1e293b',
                    color: tab === t.id ? '#0f172a' : '#ffffff'
                  }}
                >
                  {t.icon} {t.label}
                </button>
              ))}
            </div>
          </header>

          {/* Main Content Area */}
          <main style={{ maxWidth: '1100px', margin: '0 auto', padding: '24px 20px', display: 'flex', flexDirection: 'column', gap: '24px' }}>
            {(tab === 'all' || tab === 'q1') && <NetlifyDeployment />}
            {(tab === 'all' || tab === 'q2') && <FirebaseHostingConfig />}
            {(tab === 'all' || tab === 'q3') && <CustomDomainManager />}
            {(tab === 'all' || tab === 'q4') && <CiCdPipelineExplainer />}
            {(tab === 'all' || tab === 'q5') && <ChatGptDeploymentGuide />}
          </main>

          <footer style={{ borderTop: '1px solid #1e293b', padding: '20px', textAlign: 'center', fontSize: '12px', color: '#64748b' }}>
            Capstone Mini Project — Session 9 • Production Hosting, Edge CDNs & DevOps Pipeline
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
