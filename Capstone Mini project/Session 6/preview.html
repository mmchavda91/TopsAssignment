<!DOCTYPE html>

  <meta charset="UTF-8" />

  <title>Session 6: Firebase Authentication & React (Q1 - Q5)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <!-- React 18 & ReactDOM via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

    ::-webkit-scrollbar-track { background: #121212; }
    ::-webkit-scrollbar-thumb { background: #333333; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #444444; }

      from { opacity: 0; transform: translateY(6px); }

    }

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, createContext, useContext } = React;

    // ============================================================================
    // 🔐 Firebase Auth & Session Persistence Engine (Q4 Implementation)
    // ============================================================================
    // Stores authenticated session in localStorage (matching browserLocalPersistence)
    // so refreshing the browser keeps the user logged in automatically.
    const STORAGE_KEY = 'session6_firebase_auth_user';

    class FirebaseAuthEngine {
      constructor() {
        this.listeners = [];
        this.currentUser = null;
        this.loadPersistedSession();
      }

      loadPersistedSession() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            this.currentUser = JSON.parse(raw);
          }
        } catch (e) {
          this.currentUser = null;
        }
      }

      subscribe(callback) {
        this.listeners.push(callback);
        // Trigger initial state immediately (mimicking onAuthStateChanged)
        callback(this.currentUser);
        return () => {
          this.listeners = this.listeners.filter(l => l !== callback);
        };
      }

      notify() {
        this.listeners.forEach(cb => cb(this.currentUser));
      }

      async signInWithEmailAndPassword(email, password) {
        // Simulate network roundtrip to Firebase Auth
        await new Promise(r => setTimeout(r, 300));
        if (!email || !password) {
          throw new Error("auth/missing-credentials");
        }
        if (password.length < 6) {
          throw new Error("Password must be at least 6 characters.");
        }

        const user = {
          uid: 'usr_' + Math.random().toString(36).substr(2, 9),
          email: email.trim(),
          displayName: email.split('@')[0],
          loginTime: new Date().toISOString()
        };

        this.currentUser = user;
        // Q4: Persist session to localStorage so reload doesn't log out
        localStorage.setItem(STORAGE_KEY, JSON.stringify(user));
        this.notify();
        return { user };
      }

      async signOut() {
        await new Promise(r => setTimeout(r, 200));
        this.currentUser = null;
        localStorage.removeItem(STORAGE_KEY);
        this.notify();
      }
    }

    const firebaseAuth = new FirebaseAuthEngine();

    // ============================================================================
    // Q2: React Context API for Global Auth State
    // ============================================================================
    const AuthContext = createContext();

    function AuthProvider({ children }) {
      const [currentUser, setCurrentUser] = useState(null);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        // Subscribe to Firebase Auth session changes
        const unsubscribe = firebaseAuth.subscribe((user) => {
          setCurrentUser(user);
          setLoading(false);
        });
        return () => unsubscribe();
      }, []);

      const login = async (email, password) => {
        return await firebaseAuth.signInWithEmailAndPassword(email, password);
      };

      const logout = async () => {
        return await firebaseAuth.signOut();
      };

      return (
        <AuthContext.Provider value={{ currentUser, loading, login, logout }}>
          {!loading && children}
        </AuthContext.Provider>
      );
    }

    const useAuth = () => useContext(AuthContext);

    // ============================================================================
    // Q5: ChatGPT Generated Logout Button Component
    // ============================================================================
    function ChatGPTLogoutButton({ onLogoutDone }) {
      const { logout, currentUser } = useAuth();
      const [loading, setLoading] = useState(false);
      const [showModal, setShowModal] = useState(false);

      const handleLogout = async () => {
        if (!window.confirm("Are you sure you want to sign out from Spotify?")) return;
        setLoading(true);
        try {
          await logout();
          if (onLogoutDone) onLogoutDone();
        } catch (err) {
          alert("Logout failed: " + err.message);
        } finally {
          setLoading(false);
        }
      };

      if (!currentUser) return null;

      return (
        <div style={{ display: 'inline-flex', alignItems: 'center', gap: '8px' }}>
          <button
            onClick={handleLogout}
            disabled={loading}
            style={{
              backgroundColor: '#dc2626',
              color: '#ffffff',
              border: 'none',
              padding: '6px 14px',
              borderRadius: '20px',
              fontSize: '12px',
              fontWeight: '700',
              cursor: 'pointer'
            }}
          >
            {loading ? 'Logging out...' : '🚪 Sign Out'}
          </button>

          <button
            onClick={() => setShowModal(true)}
            style={{
              backgroundColor: '#262626',
              color: '#1db954',
              border: '1px solid #3e3e3e',
              padding: '5px 10px',
              borderRadius: '20px',
              fontSize: '11px',
              fontWeight: '700',
              cursor: 'pointer'
            }}
          >
            🤖 Q5 Prompt
          </button>

          {showModal && (
            <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, backgroundColor: 'rgba(0,0,0,0.7)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 9999 }}>
              <div style={{ backgroundColor: '#181818', color: '#fff', padding: '24px', borderRadius: '16px', maxWidth: '500px', width: '90%', border: '1px solid #333' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '14px' }}>
                  <h3 style={{ fontSize: '16px', color: '#1db954' }}>🤖 ChatGPT Generated Logout Button (Q5)</h3>
                  <button onClick={() => setShowModal(false)} style={{ background: 'none', border: 'none', color: '#fff', fontSize: '18px', cursor: 'pointer' }}>✕</button>
                </div>
                <div style={{ backgroundColor: '#242424', padding: '12px', borderRadius: '8px', marginBottom: '14px', fontSize: '12px' }}>
                  <strong>Prompt Sent to ChatGPT:</strong>
                  <div style={{ fontStyle: 'italic', color: '#1db954', marginTop: '4px' }}>
                    "Generate a React logout button component that updates the Context state and signs out the user from Firebase Auth."
                  </div>
                </div>
                <pre style={{ backgroundColor: '#0f172a', color: '#38bdf8', padding: '12px', borderRadius: '8px', fontSize: '11px', overflowX: 'auto', margin: 0 }}>
{`// ChatGPT Generated Solution
export function LogoutButton() {
  const { logout } = useAuth();
  return (
    <button onClick={() => logout()}>
      Sign Out
    </button>
  );
}`}
                </pre>
                <div style={{ marginTop: '14px', fontSize: '12px', color: '#86efac' }}>
                  ✔ Calls Firebase Auth <code>signOut()</code><br/>
                  ✔ Resets Context state <code>currentUser</code> to <code>null</code><br/>
                  ✔ Redirects protected routes back to login
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ============================================================================
    // Q2: Navbar Header displaying user's email at the top
    // ============================================================================
    function Navbar() {
      const { currentUser } = useAuth();

      return (

            <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
              <div style={{ width: '38px', height: '38px', borderRadius: '50%', backgroundColor: '#1db954', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '20px', color: '#000' }}>
                🎧
              </div>
              <div>
                <h1 style={{ fontSize: '18px', fontWeight: '800', letterSpacing: '-0.5px', color: '#ffffff', margin: 0 }}>
                  Spotify Web Player
                </h1>
                <span style={{ fontSize: '10px', color: '#1db954', fontWeight: '700', textTransform: 'uppercase' }}>
                  Session 6: Firebase Auth
                </span>
              </div>
            </div>

            {/* Q2 Requirement: Display user's email at top of page */}
            <div>
              {currentUser ? (
                <div style={{ display: 'flex', alignItems: 'center', gap: '14px', flexWrap: 'wrap' }}>

                    <span className="pulse-dot"></span>
                    <span style={{ fontSize: '11px', color: '#9ca3af' }}>Logged in as:</span>
                    <strong style={{ fontSize: '13px', color: '#1db954' }}>✉️ {currentUser.email}</strong>

                </div>

                <div style={{ backgroundColor: '#181818', padding: '6px 14px', borderRadius: '20px', border: '1px solid #333', fontSize: '12px', color: '#9ca3af' }}>
                  👤 Guest Mode (Please Sign In)
                </div>
              )}
            </div>
          </div>
        </header>
      );
    }

    // ============================================================================
    // Q1: Simple Login Form (Email & Password)
    // ============================================================================
    function LoginForm({ onLoginSuccess }) {
      const { login } = useAuth();
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        if (!email.trim() || !password.trim()) {
          return setError('Please enter both email and password.');
        }

        setLoading(true);
        try {
          // Question 1: Firebase Auth Sign In
          await login(email.trim(), password);
          if (onLoginSuccess) onLoginSuccess();
        } catch (err) {
          setError(err.message || 'Failed to sign in. Please check credentials.');
        } finally {
          setLoading(false);
        }
      };

      const setDemo = (e, p) => {
        setEmail(e);
        setPassword(p);
        setError('');
      };

      return (
        <div style={{ backgroundColor: '#181818', padding: '30px', borderRadius: '16px', border: '1px solid #282828', maxWidth: '440px', margin: '40px auto', boxShadow: '0 8px 30px rgba(0,0,0,0.5)' }}>
          <div style={{ textAlign: 'center', marginBottom: '20px' }}>
            <span style={{ fontSize: '11px', fontWeight: '800', color: '#1db954', backgroundColor: 'rgba(29, 185, 84, 0.15)', padding: '3px 10px', borderRadius: '12px', textTransform: 'uppercase' }}>
              Question 1
            </span>
            <h2 style={{ fontSize: '22px', fontWeight: '800', marginTop: '8px' }}>Sign In to Spotify</h2>
            <p style={{ fontSize: '13px', color: '#9ca3af', marginTop: '4px' }}>
              Sign in with your email and password using Firebase Authentication.
            </p>
          </div>

          {error && (
            <div style={{ backgroundColor: '#7f1d1d', color: '#fecaca', padding: '10px 14px', borderRadius: '8px', fontSize: '12px', marginBottom: '16px' }}>
              ⚠️ {error}
            </div>
          )}

          <form onSubmit={handleSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '14px' }}>
            <div>
              <label style={{ display: 'block', fontSize: '12px', fontWeight: '700', color: '#d1d5db', marginBottom: '6px' }}>
                Email Address
              </label>
              <input
                type="email"
                placeholder="e.g. user@spotify.com"
                value={email}
                onChange={e => setEmail(e.target.value)}
                style={{ width: '100%', padding: '11px 14px', borderRadius: '8px', border: '1px solid #333', backgroundColor: '#242424', color: '#fff', fontSize: '13px', outline: 'none' }}
                required
              />
            </div>

            <div>
              <label style={{ display: 'block', fontSize: '12px', fontWeight: '700', color: '#d1d5db', marginBottom: '6px' }}>
                Password
              </label>
              <input
                type="password"
                placeholder="Enter password (min 6 chars)..."
                value={password}
                onChange={e => setPassword(e.target.value)}
                style={{ width: '100%', padding: '11px 14px', borderRadius: '8px', border: '1px solid #333', backgroundColor: '#242424', color: '#fff', fontSize: '13px', outline: 'none' }}
                required
              />
            </div>

            <button
              type="submit"
              disabled={loading}
              style={{ backgroundColor: '#1db954', color: '#000000', border: 'none', padding: '12px', borderRadius: '24px', fontSize: '14px', fontWeight: '800', cursor: 'pointer', marginTop: '6px' }}
            >
              {loading ? 'Authenticating with Firebase...' : 'Sign In with Firebase Auth'}
            </button>
          </form>

          {/* Quick Demo Credentials */}
          <div style={{ marginTop: '20px', paddingTop: '16px', borderTop: '1px solid #282828' }}>
            <span style={{ fontSize: '11px', color: '#9ca3af', display: 'block', marginBottom: '8px' }}>⚡ 1-Click Demo Fill:</span>
            <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
              <button
                type="button"
                onClick={() => setDemo('vip.user@spotify.com', 'password123')}
                style={{ backgroundColor: '#242424', color: '#1db954', border: '1px solid #333', padding: '5px 10px', borderRadius: '6px', fontSize: '11px', cursor: 'pointer', fontFamily: 'monospace' }}
              >
                vip.user@spotify.com
              </button>
              <button
                type="button"
                onClick={() => setDemo('arijit.fan@music.in', 'password123')}
                style={{ backgroundColor: '#242424', color: '#1db954', border: '1px solid #333', padding: '5px 10px', borderRadius: '6px', fontSize: '11px', cursor: 'pointer', fontFamily: 'monospace' }}
              >
                arijit.fan@music.in
              </button>
            </div>
          </div>
        </div>
      );
    }

            <div style={{ fontSize: '44px', marginBottom: '12px' }}>🔒</div>
            <h3 style={{ fontSize: '20px', color: '#ef4444', marginBottom: '8px' }}>Access Denied: Protected Route (Q3)</h3>
            <p style={{ fontSize: '13px', color: '#9ca3af', marginBottom: '20px' }}>
              You are not logged in. You must authenticate to view your Spotify dashboard.
            </p>
            <button
              onClick={onGoToLogin}
              style={{ backgroundColor: '#1db954', color: '#000', border: 'none', padding: '10px 22px', borderRadius: '24px', fontWeight: '800', cursor: 'pointer', fontSize: '13px' }}
            >
              ← Go to Sign In Page

          </div>

      }

      const playlists = [

        { title: 'Late Night Lo-Fi Beats', count: '16 Songs', cover: '🌙', desc: 'Slowed reverb night study mix' },
        { title: 'Gym Workout Beast', count: '34 Songs', cover: '⚡', desc: 'Punjabi bass drops & EDM' },
        { title: 'Garba & Gujarati Folk', count: '22 Songs', cover: '🪕', desc: 'Aditya Gadhvi, Kinjal Dave' }
      ];

      const tracks = [
        { name: 'Kesariya', artist: 'Arijit Singh, Pritam', album: 'Brahmastra', time: '4:28' },
        { name: 'Apna Bana Le', artist: 'Arijit Singh, Sachin-Jigar', album: 'Bhediya', time: '4:21' },
        { name: 'Chaleya', artist: 'Anirudh, Shilpa Rao', album: 'Jawan', time: '3:20' },
        { name: 'Heeriye', artist: 'Jasleen Royal, Arijit Singh', album: 'Single', time: '3:15' }

            </h2>

            </p>
          </div>

          {/* Curated Playlists */}
          <div>
            <h3 style={{ fontSize: '18px', fontWeight: '700', marginBottom: '14px' }}>🎶 Your Spotify Playlists</h3>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(220px, 1fr))', gap: '16px' }}>
              {playlists.map((pl, i) => (

                    {pl.cover}
                  </div>
                  <h4 style={{ fontSize: '15px', fontWeight: '700', marginBottom: '4px' }}>{pl.title}</h4>

            <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>

    // ============================================================================
    // Q4: Session Persistence Demonstration Component
    // ============================================================================
    function SessionPersistence() {
      const { currentUser } = useAuth();

      return (
        <div style={{ backgroundColor: '#181818', borderRadius: '16px', padding: '24px', border: '1px solid #282828', maxWidth: '600px', margin: '20px auto' }}>
          <span style={{ fontSize: '11px', fontWeight: '800', color: '#60a5fa', backgroundColor: 'rgba(59, 130, 246, 0.2)', padding: '3px 10px', borderRadius: '12px', textTransform: 'uppercase' }}>
            Question 4
          </span>
          <h2 style={{ fontSize: '20px', fontWeight: '800', marginTop: '6px' }}>
            🔄 Session Persistence in Firebase Auth
          </h2>
          <p style={{ fontSize: '13px', color: '#9ca3af', marginTop: '4px', lineHeight: 1.5 }}>
            Firebase Auth keeps the user logged in across page reloads using <code>browserLocalPersistence</code> (IndexedDB/localStorage) and restores state via <code>onAuthStateChanged</code>.
          </p>

          <div style={{ backgroundColor: '#121212', padding: '16px', borderRadius: '10px', border: '1px solid #282828', margin: '16px 0', fontSize: '13px', display: 'flex', flexDirection: 'column', gap: '8px' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between' }}>
              <span style={{ color: '#9ca3af' }}>Current Status:</span>
              <strong style={{ color: currentUser ? '#10b981' : '#f59e0b' }}>
                {currentUser ? '✅ User Session Active & Saved' : '⏳ No Active Session'}
              </strong>
            </div>
            {currentUser && (
              <>
                <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                  <span style={{ color: '#9ca3af' }}>User Email:</span>
                  <code>{currentUser.email}</code>
                </div>
                <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                  <span style={{ color: '#9ca3af' }}>Storage Type:</span>
                  <span>localStorage / IndexedDB</span>
                </div>
              </>
            )}
          </div>

          <button
            onClick={() => window.location.reload()}
            style={{ backgroundColor: '#2563eb', color: '#fff', border: 'none', padding: '10px 20px', borderRadius: '20px', fontSize: '13px', fontWeight: '700', cursor: 'pointer' }}
          >
            🔄 Reload / Refresh Browser Now (Test Persistence)
          </button>
          <span style={{ display: 'block', fontSize: '12px', color: '#6b7280', marginTop: '8px' }}>
            When you click reload, you will remain logged in without typing credentials again!
          </span>
        </div>
      );
    }

    // ============================================================================
    // Main Root App
    // ============================================================================
    function App() {
      const { currentUser } = useAuth();
      const [tab, setTab] = useState('dashboard');

      useEffect(() => {
        if (!currentUser) setTab('login');
        else if (tab === 'login') setTab('dashboard');
      }, [currentUser]);

      return (
        <div>
          {/* Q2: Header displaying email */}
          <Navbar />

          {/* Sub Navigation */}
          <div style={{ backgroundColor: '#181818', borderBottom: '1px solid #282828', padding: '10px 20px' }}>
            <div style={{ maxWidth: '1100px', margin: '0 auto', display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
              {[
                { id: 'dashboard', label: 'Q3: Spotify Dashboard (Protected)', icon: '🎵' },
                { id: 'login', label: 'Q1: Login Form', icon: '🔐' },
                { id: 'persistence', label: 'Q4: Session Persistence Test', icon: '🔄' }
              ].map(t => (
                <button
                  key={t.id}
                  onClick={() => setTab(t.id)}
                  style={{
                    border: 'none',
                    padding: '7px 16px',
                    borderRadius: '20px',
                    fontSize: '12px',
                    cursor: 'pointer',
                    fontWeight: tab === t.id ? '800' : '500',
                    backgroundColor: tab === t.id ? '#1db954' : '#242424',
                    color: tab === t.id ? '#000000' : '#ffffff'
                  }}
                >
                  {t.icon} {t.label}
                </button>
              ))}
            </div>
          </div>

          {/* Main Container */}
          <main style={{ maxWidth: '1100px', margin: '0 auto', padding: '24px 20px' }}>
            {tab === 'login' && <LoginForm onLoginSuccess={() => setTab('dashboard')} />}
            {tab === 'dashboard' && <SpotifyDashboard onGoToLogin={() => setTab('login')} />}
            {tab === 'persistence' && <SessionPersistence />}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <AuthProvider>
        <App />
      </AuthProvider>
    );
  </script>
</body>
</html>
